})(window.G);

</script>
<script>
/* ===== js/core/ending.js ===== */
/* ============================================================
   ending.js —— 结局结算与五年回顾
   ============================================================ */
window.G = window.G || {};
(function(G){
'use strict';
var E = G.ending = {};
var U = G.ui;

var JOB_SCORE = { SS:30, S:25, A:20, B:14, C:8, D:0 };
var RANK_TEXT = {
  SS:'SS · 顶级大厂', S:'S · 一线大厂', A:'A · 中厂', B:'B · 稳健公司',
  C:'C · 保底', D:'D · 没有 offer'
};

function pickEndingId(r){
  if(r.grad === '休学') return 'dropout';
  if(r.hometown) return 'home';
  if(r.startup === '上市') return 'ipo';
  if(r.startup === '被收购') return 'acquired';
  if(r.startup === '小而美') return 'small';
  if(r.startup === '烧光' || r.startup === '跑路') return 'burned';
  if(r.job === 'SS' && r.grad === '正常') return 'counterattack';
  if((r.transfer === '985' || r.transfer === '211') && (r.job === 'S' || r.job === 'A' || r.job === 'SS')) return 'newhand';
  if(r.kaoyan === '上岸') return 'gradschool';
  if(r.kaogong === '上岸') return 'civil';
  if(r.job === 'D' && r.secondRun) return 'jobless2';
  if(r.job === 'D') return 'jobless';
  if(r.spring && (r.job === 'B' || r.job === 'C')) return 'saved';
  if(r.job === 'A') return 'steady';
  return 'ordinary';
}

E.figure = function(){
  var s = G.state;
  var all = (s.offers || []).slice();
  var best = null;
  all.forEach(function(o){ if(o && o.salary && (!best || o.salary > best.salary)) best = o; });
  if(s.signed && (!best || s.signed.salary > best.salary)) best = s.signed;
  if(s.flags.returnOffer && !best) best = { name:'实习转正', salary:13, tier:'B' };
  if(s.flags.secondChanceOffer && !best) best = { name:'前公司回头挖人', salary:11, tier:'B' };

  var job = 'D';
  if(best) job = G.OFFER_RANK(best.salary);
  if(s.kaogongResult === '上岸') job = job === 'D' ? 'C' : job;

  var grad = s.delaySemesters > 0 ? '延毕' : '正常';
  if(s.ending === 'dropout') grad = '休学';

  var spring = false;
  all.forEach(function(o){ if(o && o.source && o.source.indexOf('春招') >= 0) spring = true; });

  return {
    job:job,
    best:best,
    startup:s.startup ? s.startup.result : null,
    kaoyan:s.kaoyanResult || null,
    kaogong:s.kaogongResult || null,
    grad:grad,
    transfer:s.transfer && s.transfer.done ? s.transfer.result : null,
    spring:spring,
    secondRun:s.chapter === 8,
    hometown:!!s.flags.hometown,
    edu:s.edu,
    avg:Math.round(G.avgStat()),
    moodAvg:s.moodCurve.length ? Math.round(s.moodCurve.reduce(function(a,b){return a+b;},0) / s.moodCurve.length) : Math.round(s.res.mood),
    tags:s.tags,
    score:0,
    grade:''
  };
};

E.computeScore = function(r){
  var s = G.state;
  var tagScore = 0;
  s.tags.forEach(function(t){
    if(t.type === 'hard') tagScore += 4;
    else if(t.type === 'soft') tagScore += 2;
    else if(t.type === 'negative') tagScore -= 3;
  });
  tagScore = G.clamp(tagScore, -10, 16);

  var v = JOB_SCORE[r.job] +
          ((r.edu - 30) / 40) * 15 +
          r.avg * 0.25 +
          r.moodAvg * 0.15 +
          tagScore;
  v = Math.round(G.clamp(v, 0, 100));
  var grade = v >= 85 ? 'S' : v >= 70 ? 'A' : v >= 55 ? 'B' : v >= 40 ? 'C' : 'D';
  return { score:v, grade:grade };
};

E.trigger = function(id){ E.show(id); };

E.show = function(id){
  var s = G.state;
  var r = E.figure();
  if(id !== 'dropout') id = pickEndingId(r);
  var def = null;
  for(var i=0;i<G.ENDINGS.length;i++) if(G.ENDINGS[i].id === id) def = G.ENDINGS[i];
  if(!def) def = G.DEFAULT_ENDING;
  E.render(def, r);
};

E.compute = function(){
  var s = G.state;
  var r = E.figure();
  var id = s.ending === 'dropout' ? 'dropout' : pickEndingId(r);
  var sc = E.computeScore(r);
  r.score = sc.score; r.grade = sc.grade;
  s.ending = id;
  s.finalResult = r;
  s.finalScore = sc.score;
  G.save();
  var def = null;
  for(var i=0;i<G.ENDINGS.length;i++) if(G.ENDINGS[i].id === id) def = G.ENDINGS[i];
  if(!def) def = G.DEFAULT_ENDING;
  E.render(def, r);
};

/* ---------------- 渲染 ---------------- */
E.render = function(def, r){
  var s = G.state;
  var tone = G.TONE_COLOR[def.tone] || '#9fb0c9';
  var catLabels = { SS:'顶级大厂', S:'一线大厂', A:'中厂', B:'稳健公司', C:'保底', D:'暂无' };

  /* 雷达 */
  var vals = G.STAT_LIST.map(function(x){ return s.stats[x.key]; });
  var labels = G.STAT_LIST.map(function(x){ return x.name.slice(0,2); });

  /* 心态曲线 */
  var moods = s.moodCurve.slice();
  if(!moods.length) moods = [Math.round(s.res.mood)];
  if(moods.length === 1) moods = [moods[0], moods[0]];
  var chLabels = moods.map(function(_, i){ return 'C' + (i+1); });

  /* 标签 */
  var tagsHtml = s.tags.length ? s.tags.map(function(t){
    return '<span class="tag ' + t.type + '">' + U.esc(t.name) + '</span>';
  }).join('') : '<span class="empty-note">简历上什么都没留下。</span>';

  /* 五维结局 */
  var gradCls = r.grad === '正常' ? '' : 'bad';
  var jobCls = (r.job === 'SS' || r.job === 'S') ? 'ss' : (r.job === 'D' ? 'bad' : '');

  var strongest = G.STAT_LIST.slice().sort(function(a,b){ return s.stats[b.key] - s.stats[a.key]; })[0];
  var summary = '这五年你最拿得出手的是 <b style="color:#fff">' + strongest.name + '</b>（' + Math.round(s.stats[strongest.key]) + '）。';

  var body =
    '<section class="screen active" id="screen-ending">' +
    '<div class="ending-wrap">' +
      '<div class="ending-rank">' + r.grade + '</div>' +
      '<h1 class="ending-title" style="color:' + tone + '">' + U.esc(def.name) + '</h1>' +
      '<p class="ending-sub">' + U.esc(def.quote) + '</p>' +

      '<div class="ending-grid">' +
        '<div class="ending-card"><div class="k">就业</div><div class="v ' + jobCls + '">' + (r.best ? (r.best.name || catLabels[r.job]) : '无') + '</div>' +
          '<div style="font-size:11px;color:#7d8a9e;margin-top:3px">' + (r.best ? r.best.salary + ' 万/年 · ' + catLabels[r.job] : '没有拿到 offer') + '</div></div>' +
        '<div class="ending-card"><div class="k">毕业</div><div class="v ' + gradCls + '">' + r.grad + '</div></div>' +
        '<div class="ending-card"><div class="k">考研</div><div class="v">' + (r.kaoyan || '—') + '</div></div>' +
        '<div class="ending-card"><div class="k">考公</div><div class="v">' + (r.kaogong || '—') + '</div></div>' +
        (r.startup ? '<div class="ending-card"><div class="k">创业</div><div class="v">' + r.startup + '</div></div>' : '') +
        '<div class="ending-card"><div class="k">转学</div><div class="v">' + (r.transfer || '未尝试') + '</div></div>' +
      '</div>' +

      '<div class="ending-quote">' + U.esc(def.text).replace(/\n/g,'<br>') + '</div>' +

      '<div class="section-label" style="margin:26px 0 10px">五年评价</div>' +
      '<div class="chart-box" style="display:flex;align-items:center;gap:26px;flex-wrap:wrap">' +
        '<div style="font-family:var(--mono);font-size:52px;font-weight:700;color:' +
          (r.score >= 85 ? '#f5c451' : r.score >= 70 ? '#3fd6a0' : r.score >= 55 ? '#9fb0c9' : '#ff5f6d') + '">' + r.score + '</div>' +
        '<div style="flex:1;min-width:200px">' +
          '<div style="font-size:12px;color:#8d99ad;line-height:2">' +
            '就业 ' + JOB_SCORE[r.job] + ' / 学历 '+ (Math.round((r.edu-30)/40*15)) + ' / 六维 ' + r.avg +
            ' / 心态均值 ' + r.moodAvg + ' / 标签 ' + s.tags.length + ' 个<br>' +
            '学会 ' + s.knows.length + ' 个知识点，其中 ' + s.knows.filter(function(k){ return k.weak; }).length + ' 个是薄弱点。<br>' +
            summary +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="section-label" style="margin:26px 0 10px">六维</div>' +
      '<div class="chart-box"><div class="radar-box">' +
        '<div>' + U.radarSVG(vals, labels, 280) + '</div>' +
        '<div class="stat-list">' +
          G.STAT_LIST.map(function(st){
            var v = Math.round(s.stats[st.key]);
            return '<div class="sl-row"><span class="sl-name">' + st.name + '</span>' +
              '<span class="sl-track"><i class="sl-fill" style="width:' + v + '%;background:linear-gradient(90deg,#ff6b3d,#f5c451)"></i></span>' +
              '<span class="sl-val">' + v + '</span></div>';
          }).join('') +
        '</div>' +
      '</div></div>' +

      '<div class="section-label" style="margin:26px 0 10px">心态曲线</div>' +
      '<div class="chart-box">' +
        U.lineChartSVG([{ data:moods, color:'#ff8fb2', fill:'#ff8fb2' }], { labels:chLabels }) +
        '<div class="chart-legend"><span><i style="background:#ff8fb2"></i>心态（每学期末）</span></div>' +
      '</div>' +

      '<div class="section-label" style="margin:26px 0 10px">标签墙</div>' +
      '<div class="chart-box"><div class="tag-wrap">' + tagsHtml + '</div></div>' +

      '<div class="section-label" style="margin:26px 0 10px">时间轴</div>' +
      '<div class="chart-box"><div class="timeline">' +
        G.CHAPTERS.map(function(ch, i){
          var done = i < s.chapter;
          var cur = i === s.chapter;
          var mood = s.moodCurve[i];
          return '<div class="tl-item ' + (done ? 'done' : '') + (cur ? ' current' : '') + '">' +
            '<div class="tl-left"><div class="tl-ch">' + ch.num + '</div><div class="tl-name">' + ch.name + '</div></div>' +
            '<div class="tl-axis"><div class="tl-node"></div></div>' +
            '<div class="tl-right"><div style="font-size:12px;color:#b9c3d3">' + ch.sub + '</div>' +
              '<div class="tl-desc">' + (mood !== undefined ? '学期末心态 ' + mood : '') + '</div></div>' +
          '</div>';
        }).join('') +
      '</div></div>' +

      '<div class="ending-actions">' +
        '<button class="btn btn-primary" id="end-again">再 来 一 局</button>' +
        '<button class="btn btn-ghost" id="end-title">回 到 标 题</button>' +
      '</div>' +
    '</div>' +
    '</section>';

  /* 替换界面 */
  var old = document.getElementById('screen-ending');
  if(old) old.parentNode.removeChild(old);
  var holder = document.createElement('div');
  holder.innerHTML = body;
  document.body.appendChild(holder.firstChild);

  ['screen-title','screen-create','screen-game'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.classList.remove('active');
  });
  window.scrollTo(0,0);

  document.getElementById('end-again').addEventListener('click', function(){
    document.getElementById('screen-ending').classList.remove('active');
    G.clearSave();
    G.state = null;
    G.main.toTitle();
  });
  document.getElementById('end-title').addEventListener('click', function(){
    document.getElementById('screen-ending').classList.remove('active');
    G.main.toTitle();
  });
};

})(window.G);

</script>
<script>
/* ===== js/main.js ===== */
/* ============================================================
   main.js —— 标题 / 开局 / 菜单 / 档案 / 时间轴
   ============================================================ */
window.G = window.G || {};
(function(G){
'use strict';
var U = G.ui;
var M = G.main = {};

var create = { major:null, name:null, family:null, stats:null };

/* ---------------- 标题页 ---------------- */
M.toTitle = function(){
  var cont = document.getElementById('btn-continue');
  if(cont) cont.disabled = !G.hasSave();
  U.showScreen('title');
  var old = document.getElementById('screen-ending');
  if(old) old.parentNode.removeChild(old);
};

/* ---------------- 开局 ---------------- */
M.openCreate = function(){
  create = { major:null, name:null, family:null, stats:null };
  U.showScreen('create');
  renderMajorCards();
  var det = document.getElementById('create-detail');
  if(det){ det.classList.remove('show'); det.innerHTML = ''; }
  var go = document.getElementById('btn-create-go');
  if(go) go.disabled = true;
};

function renderMajorCards(){
  var box = document.getElementById('major-cards');
  if(!box) return;
  var keys = ['engineering','humanities','science'];
  box.innerHTML = keys.map(function(k){
    var m = G.MAJORS[k];
    var mods = [];
    for(var s in m.start){
      var v = m.start[s];
      var label = G.statName(s) + ' ' + (v > 0 ? '+' : '') + v;
      mods.push('<span class="mc-mod ' + (v > 0 ? 'up' : 'down') + '">' + label + '</span>');
    }
    for(var g in m.growth){
      mods.push('<span class="mc-mod">成长 ' + G.statName(g) + ' ×' + m.growth[g] + '</span>');
    }
    return '<button class="major-card' + (create.major === k ? ' sel' : '') + '" data-major="' + k + '">' +
      '<span class="mc-icon">' + m.icon + '</span>' +
      '<div class="mc-name">' + m.name + '</div>' +
      '<div class="mc-examples">' + m.examples.join(' / ') + '</div>' +
      '<div class="mc-mods">' + mods.join('') + '</div>' +
      '<div class="mc-roles">可走岗位：<b>' + m.roles.join('、') + '</b></div>' +
      '</button>';
  }).join('');

  box.querySelectorAll('[data-major]').forEach(function(b){
    b.addEventListener('click', function(){
      create.major = b.getAttribute('data-major');
      rollName();
      renderMajorCards();
      renderDetail();
    });
  });
}

function rollName(){
  var m = G.MAJORS[create.major];
  create.name = G.pick(m.examples);
  create.family = G.pick(G.FAMILY_TIERS);
  create.stats = previewStats();
}

function previewStats(){
  var m = G.MAJORS[create.major];
  var out = {};
  G.STAT_KEYS.forEach(function(k){
    var v = G.BASE_STAT + (m.start[k] || 0) + G.randInt(-2,2);
    out[k] = Math.round(G.clamp(v, G.START_RANGE[0], G.START_RANGE[1]));
  });
  return out;
}

function renderDetail(){
  var det = document.getElementById('create-detail');
  if(!det) return;
  var m = G.MAJORS[create.major];
  var fam = create.family;
  det.classList.add('show');
  det.innerHTML =
    '<div class="detail-box">' +
      '<div class="detail-col">' +
        '<h3>专业</h3>' +
        '<div class="pick-row">' +
          '<span class="pick-chip sel">' + create.name + '</span>' +
          '<button class="pick-chip" id="re-name">换一个</button>' +
        '</div>' +
        '<h3 style="margin-top:18px">家底</h3>' +
        '<div class="pick-row">' +
          '<span class="pick-chip sel">' + fam.name + '</span>' +
          '<button class="pick-chip" id="re-family">换个命</button>' +
        '</div>' +
        '<div class="family-note">' + fam.desc + '<br>每月生活费 ¥' + fam.allowance + ' · 开局现金 ¥' + fam.startCash + '</div>' +
      '</div>' +
      '<div class="detail-col">' +
        '<h3>六维初始</h3>' +
        '<div class="stat-grid">' +
          G.STAT_LIST.map(function(st){
            return '<div class="stat-cell"><div class="sv">' + create.stats[st.key] + '</div><div class="sn">' + st.name + '</div></div>';
          }).join('') +
        '</div>' +
        '<div class="family-note" style="margin-top:14px">' + m.desc.replace(/\n/g,'<br>') + '<br><span style="color:#8d99ad">' + m.jobNote + '</span></div>' +
      '</div>' +
    '</div>';

  det.querySelector('#re-name').addEventListener('click', function(){
    create.name = G.pick(m.examples);
    renderDetail();
  });
  det.querySelector('#re-family').addEventListener('click', function(){
    create.family = G.pick(G.FAMILY_TIERS);
    renderDetail();
  });

  var go = document.getElementById('btn-create-go');
  if(go) go.disabled = false;
}

/* ---------------- 档案 ---------------- */
M.profile = function(){
  var s = G.state;
  if(!s) return;
  var vals = G.STAT_LIST.map(function(x){ return s.stats[x.key]; });
  var labels = G.STAT_LIST.map(function(x){ return x.name.slice(0,2); });
  var breakdown = G.resumeBreakdown();

  var html =
    '<div class="chart-box"><div class="radar-box">' +
      '<div>' + U.radarSVG(vals, labels, 260) + '</div>' +
      '<div>' +
        '<div class="kv-grid" style="grid-template-columns:1fr 1fr">' +
          '<div class="kv"><div class="k">学校</div><div class="v" style="font-size:15px">' + G.schoolName() + '</div></div>' +
          '<div class="kv"><div class="k">专业</div><div class="v" style="font-size:14px">' + s.majorName + '</div></div>' +
          '<div class="kv"><div class="k">绩点</div><div class="v">' + s.gpa.toFixed(2) + '</div></div>' +
          '<div class="kv"><div class="k">简历分</div><div class="v">' + G.resumeScore() + '</div></div>' +
        '</div>' +
        '<div style="margin-top:12px;font-size:11.5px;color:#8d99ad;line-height:2">' +
          breakdown.map(function(b){ return b.k + ' ' + b.v; }).join(' · ') +
        '</div>' +
      '</div>' +
    '</div></div>' +
    '<div class="section-label" style="margin:22px 0 10px">标签墙</div>' +
    '<div class="chart-box"><div class="tag-wrap">' +
      (s.tags.length ? s.tags.map(function(t){
        return '<span class="tag ' + t.type + '">' + U.esc(t.name) + '</span>';
      }).join('') : '<span class="empty-note">还没有任何标签。</span>') +
    '</div></div>' +
    '<div class="section-label" style="margin:22px 0 10px">知识账本</div>' +
    '<div class="chart-box"><div class="know-list" style="max-height:none">' +
      (s.knows.length ? s.knows.map(function(k){
        return '<span class="know' + (k.weak ? ' weak' : '') + '">' + U.esc(k.n) + '</span>';
      }).join('') : '<span class="empty-note">空白。答辩那天会很难看。</span>') +
    '</div></div>' +
    '<div class="section-label" style="margin:22px 0 10px">状态</div>' +
    '<div class="chart-box"><div class="kv-grid">' +
      '<div class="kv"><div class="k">转学</div><div class="v" style="font-size:14px">' +
        (!s.transfer.known ? '还不知道这条路' :
         s.transfer.done ? (s.transfer.result || '已结束') :
         (s.transfer.applied ? '已申请 · 等待考试' : '材料 ' + Math.round(s.transfer.prep) + '%')) + '</div></div>' +
      '<div class="kv"><div class="k">延毕</div><div class="v">' + s.delaySemesters + '<small>学期</small></div></div>' +
      '<div class="kv"><div class="k">考研复习</div><div class="v">' + Math.round(s.routes.kaoyan) + '<small>%</small></div></div>' +
      '<div class="kv"><div class="k">考公复习</div><div class="v">' + Math.round(s.routes.kaogong) + '%</div></div>' +
      '<div class="kv"><div class="k">已触发事件</div><div class="v">' + s.totalEvents + '</div></div>' +
      '<div class="kv"><div class="k">学期</div><div class="v" style="font-size:13px">' + G.chapterInfo(s.chapter).name + '</div></div>' +
    '</div></div>' +
    '<div class="section-label" style="margin:22px 0 10px">最近记录</div>' +
    '<div class="chart-box"><div class="su-log" style="max-height:180px">' +
      (s.history.slice(-14).reverse().map(function(h){
        return '<div>' + U.esc(h.text) + '</div>';
      }).join('') || '<div class="empty-note">还没有记录。</div>') +
    '</div></div>';

  U.modal({ eyebrow:'档案', title:'五年档案', body:html, size:'wide' });
};

/* ---------------- 时间轴 ---------------- */
M.timeline = function(){
  var s = G.state;
  if(!s) return;
  var html = '<div class="timeline">' + G.CHAPTERS.map(function(ch, i){
    var done = i < s.chapter;
    var cur = i === s.chapter;
    var mood = s.moodCurve[i];
    return '<div class="tl-item ' + (done ? 'done' : '') + (cur ? ' current' : '') + '">' +
      '<div class="tl-left"><div class="tl-ch">' + ch.num + '</div><div class="tl-name">' + ch.name + '</div></div>' +
      '<div class="tl-axis"><div class="tl-node"></div></div>' +
      '<div class="tl-right"><div style="font-size:12.5px;color:#b9c3d3">' + ch.sub + '</div>' +
        '<div class="tl-desc">' +
          (done ? '已完成' + (mood !== undefined ? ' · 期末心态 ' + mood : '') :
           cur ? '进行中 · 第 ' + s.week + ' / 20 周 · 心态 ' + Math.round(s.res.mood) : '未开始') +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';

  U.modal({
    eyebrow:'时间轴', title:'8 学期 + 毕业后一年',
    body:'<p style="margin-bottom:16px;color:#7d8a9e;font-size:12px">共 180 回合。当前进度 ' +
      (s.turn) + ' / ' + G.TOTAL_TURNS + '。</p>' + html,
    size:'wide'
  });
};

/* ---------------- 菜单 ---------------- */
M.menu = function(){
  U.modal({
    eyebrow:'菜单', title:'暂停一下',
    opts:[
      { label:'保存进度', hint:'存到浏览器本地', onClick:function(){ G.save(); U.toast('已保存', 'up', ''); U.modal(M.menuCfg()); } },
      { label:'读取存档', hint:'会丢失当前进度',
        onClick:function(){
          U.confirm('读取存档', '<p>当前进度会丢失。确定吗？</p>', function(){
            if(G.resume()) U.toast('已读取', 'up', '');
            else U.toast('没有存档', 'down', '');
          });
        } },
      { label:'玩法说明', hint:'规则与四种小游戏', onClick:function(){ M.help(); } },
      { label:'重新开局', hint:'清空当前存档',
        onClick:function(){
          U.confirm('重新开局', '<p>这会清空当前存档，从大一上重新开始。</p>', function(){
            G.clearSave(); G.state = null; M.openCreate();
          }, '重新开始');
        } },
      { label:'回到标题', hint:'下次可从存档继续', onClick:function(){ G.save(); G.state = null; M.toTitle(); } }
    ]
  });
};
M.menuCfg = function(){ return { eyebrow:'菜单', title:'已保存', body:'<p>进度已写入浏览器本地存储。</p>', size:'narrow' }; };

/* ---------------- 说明 ---------------- */
M.help = function(){
  U.modal({
    eyebrow:'玩法说明', title:'怎么玩',
    body:
      '<p><b style="color:#fff">一回合 = 一周。</b>每周从行动卡里选一张，花掉行动点（AP）。每学期 20 AP / 20 周，花超了就只能休息。</p>' +
      '<p><b style="color:#fff">六维</b>决定你的简历分和一切判定。60 点以上成长会变慢，所以一学期只够主攻 1~2 个方向。</p>' +
      '<p><b style="color:#fff">随机事件</b>每学期至少 2 个，全局限 90 个事件里抽。选项没有纯赚的。</p>' +
      '<p><b style="color:#fff">转学</b>：大一下获知信息 → 大二上打听、申请 → 大二下考试。评分 =（竞赛×2 + 专业能力）÷ 3 + 骰点修正。转入 985 会延毕 2 学期。</p>' +
      '<p><b style="color:#fff">知识账本</b>记录你学过和答错过的东西，大四下答辩时会逐条回收。</p>' +
      '<div class="section-label" style="margin:18px 0 10px">四种小游戏</div>' +
      '<p>📮 <b>跑酷投递</b>：5 秒内点中 HR 头像 9 次以上。人脉越高，HR 动得越慢、越好点。<br>' +
      '🎲 <b>跑团面试</b>：d20 + 六维加值 vs 难度 DC，三题过两题。<br>' +
      '🧩 <b>解密</b>：考公行测 3 题 90 秒 / 考研复试 2 题。<br>' +
      '🚀 <b>创业</b>：8 个月，拿投资、招人、活下来。会吃掉大四秋招。</p>' +
      '<p style="color:#8d99ad">提示：先把「专业能力」和「竞赛」拉起来，转学和秋招都吃这两项。人脉决定你能不能拿到情报。</p>',
    size:'wide'
  });
};

/* ---------------- 绑定 ---------------- */
function bind(){
  var newBtn = document.getElementById('btn-new');
  if(newBtn) newBtn.addEventListener('click', function(){
    if(G.hasSave()){
      U.confirm('开始新的一局', '<p>检测到存档。新开一局不会删除存档，但可能被覆盖。</p>', function(){
        M.openCreate();
      }, '继续新开');
      return;
    }
    M.openCreate();
  });

  var contBtn = document.getElementById('btn-continue');
  if(contBtn){
    contBtn.disabled = !G.hasSave();
    contBtn.addEventListener('click', function(){
      if(!G.hasSave()){ U.toast('没有存档', 'down', ''); return; }
      if(!G.resume()) U.toast('读取失败', 'down', '');
    });
  }

  var helpBtn = document.getElementById('btn-help');
  if(helpBtn) helpBtn.addEventListener('click', M.help);

  var backBtn = document.getElementById('btn-create-back');
  if(backBtn) backBtn.addEventListener('click', M.toTitle);

  var goBtn = document.getElementById('btn-create-go');
  if(goBtn) goBtn.addEventListener('click', function(){
    if(!create.major) return;
    var stats = create.stats;
    G.flow.startNew(create.major, create.name, create.family.key);
    if(stats && G.state){ G.state.stats = stats; U.refresh(); }
  });

  var prof = document.getElementById('btn-profile');
  if(prof) prof.addEventListener('click', M.profile);
  var tl = document.getElementById('btn-timeline');
  if(tl) tl.addEventListener('click', M.timeline);
  var menu = document.getElementById('btn-menu');
  if(menu) menu.addEventListener('click', M.menu);

  /* 离开页面自动保存 */
  window.addEventListener('beforeunload', function(){
    if(G.state && !G.state.ending) G.save();
  });

  /* ESC 关闭非强制弹窗 */
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      var root = document.getElementById('modal-root');
      if(root && root.classList.contains('open')) U.closeModal();
    }
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', function(){ bind(); M.toTitle(); });
} else {
  bind(); M.toTitle();
}

})(window.G);

</script>
</body>
</html>
