F.applyTransfer = function(score, done){
  var s = G.state;
  var tier = G.TRANSFER.tiers[G.TRANSFER.tiers.length-1];
  for(var i=0;i<G.TRANSFER.tiers.length;i++){
    if(score >= G.TRANSFER.tiers[i].min){ tier = G.TRANSFER.tiers[i]; break; }
  }
  s.transfer.done = true;
  s.transfer.result = tier.key;
  s.transfer.score = score;
  s.delaySemesters += (tier.delay || 0);
  s.res.mood = G.clamp(s.res.mood + tier.mood, 0, 100);

  if(tier.edu > 0){
    s.edu = tier.edu;
    s.stats.network = Math.round(s.stats.network * tier.netMul);
    s.res.rep = 0;
    s.socialDebuff = { weeks:tier.socialWeeks, mul:tier.socialMul };
    G.addTag('转学成功', 'hard');
    if(tier.tag) G.addTag(tier.key === '985' ? '985 平台' : tier.key === '211' ? '211 平台' : '一本平台', 'soft');
    if(tier.key === '985'){
      G.gainMoney(-800);
      G.log('家里因为转学的事吵了一架。生活费被砍了 800。', 'bad');
    }
  } else {
    G.addTag('转学失败','negative');
  }
  G.log('转学结果：' + tier.title + '（评分 ' + score + '）', 'exam');
  U.refresh();

  var color = tier.edu >= 55 ? '#f5c451' : tier.edu >= 40 ? '#3fd6a0' : '#ff5f6d';
  U.modal({
    eyebrow:'转学结果', title:tier.title,
    body:'<div style="text-align:center;margin-bottom:16px">' +
           '<div style="font-family:monospace;font-size:46px;color:' + color + '">' + score + '</div>' +
           '<div style="font-size:11px;letter-spacing:.2em;color:#7d8a9e">转学评分</div>' +
         '</div>' +
         '<p>' + U.esc(tier.text).replace(/\n/g,'</p><p>') + '</p>' +
         '<p style="color:#8d99ad;font-size:12px">人脉 ×' + tier.netMul + ' · 声望清零 · 心态 ' + tier.mood +
         (tier.delay ? ' · 延毕 ' + tier.delay + ' 学期' : '') + '</p>',
    size:'narrow',
    footHTML:'<div class="modal-foot"><button class="btn btn-primary" id="f-ok">继 续</button></div>',
    onMount:function(p){
      p.querySelector('#f-ok').addEventListener('click', function(){ U.closeModal(); done(); });
    }
  });
};

<script>
/* ===== js/mini/parkour.js ===== */
/* ============================================================
   parkour.js —— 小游戏：跑酷投递（5 秒点击）
   + 通用小游戏外壳 G.mini.shell / 音效 G.sfx
   ============================================================ */
window.G = window.G || {};
(function(G){
'use strict';

G.mini = G.mini || {};

/* ---------------- 极简音效（WebAudio，无素材） ---------------- */
G.sfx = (function(){
  var ctx = null;
  function ensure(){
    if(ctx) return ctx;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) ctx = new AC();
    }catch(e){ ctx = null; }
    return ctx;
  }
  function blip(freq, dur, type, vol){
    var c = ensure();
    if(!c) return;
    if(c.state === 'suspended'){ try{ c.resume(); }catch(e){} }
    try{
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'square';
      o.frequency.value = freq || 440;
      g.gain.value = 0;
      o.connect(g); g.connect(c.destination);
      var t = c.currentTime;
      g.gain.linearRampToValueAtTime(vol === undefined ? 0.04 : vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.07));
      o.start(t); o.stop(t + (dur || 0.07) + 0.02);
    }catch(e){}
  }
  return {
    tap:function(){ blip(620 + Math.random()*90, 0.05, 'square', 0.035); },
    click:function(){ blip(880, 0.06, 'triangle', 0.05); },
    win:function(){ blip(660,0.09,'triangle',0.07); setTimeout(function(){blip(990,0.12,'triangle',0.07);},90); },
    lose:function(){ blip(220,0.16,'sawtooth',0.05); },
    roll:function(){ blip(300,0.04,'square',0.03); },
    tick:function(){ blip(1100,0.03,'square',0.025); }
  };
})();

/* ---------------- 通用小游戏外壳 ---------------- */
G.mini.shell = function(cfg){
  var root = document.createElement('div');
  root.className = 'mini-root';
  var html = '<div class="mini-head">' +
    '<div><div class="mini-title">' + G.ui.esc(cfg.title) + '</div>' +
    (cfg.sub ? '<div class="mini-sub">' + G.ui.esc(cfg.sub) + '</div>' : '') + '</div>' +
    (cfg.closable ? '<button class="icon-btn mini-close" id="mini-x">✕</button>' : '') +
    '</div>' +
    '<div class="mini-body"></div>';
  root.innerHTML = html;
  document.body.appendChild(root);
  var body = root.querySelector('.mini-body');
  var api = {
    root:root,
    body:body,
    close:function(){
      if(root.parentNode) root.parentNode.removeChild(root);
    }
  };
  if(cfg.closable){
    root.querySelector('#mini-x').addEventListener('click', function(){ api.close(); if(cfg.onClose) cfg.onClose(); });
  }
  if(cfg.build) cfg.build(body, api);
  return api;
};

/* ============================================================
   跑酷投递
   ============================================================ */
G.mini.parkour = function(opts){
  opts = opts || {};
  var P = G.PARKOUR;
  /* 难度挂钩人脉：人脉越高，HR 移动越慢、越好点 */
  var net = G.clamp(G.state.stats.network, 0, 100);
  var ease = P.easeMin + (net/100) * (P.easeMax - P.easeMin);
  var tickMs = Math.round(P.tick * ease);
  var netLabel = net >= 80 ? '内推直达，HR 的动作像在放慢镜头'
               : net >= 55 ? '有人帮你打过招呼，头像明显慢了一点'
               : net >= 30 ? '正常节奏'
               : '人情生疏，头像跑得很快';
  var hits = 0, misses = 0, running = false, ended = false;
  var startAt = 0, rafId = null, moveTimer = null, endTimer = null;
  var avatarEl, hitsEl, missEl, fillEl, arenaEl;

  var shell = G.mini.shell({
    title:'跑酷投递',
    sub:'把简历塞进 HR 的邮箱 · 5 秒内点中头像 ' + P.target + ' 次'
  });

  shell.body.innerHTML =
    '<div class="parkour-arena" id="pk-arena">' +
      '<div class="pk-timerbar"><div class="pk-timerfill" id="pk-fill"></div></div>' +
      '<div class="parkour-hud">' +
        '<div class="pk-stat"><div class="k">命中</div><div class="v" id="pk-hits">0</div></div>' +
        '<div class="pk-stat"><div class="k">目标</div><div class="v" style="font-size:22px;color:#8d99ad">' + P.target + '</div></div>' +
        '<div class="pk-stat"><div class="k">空点</div><div class="v" id="pk-miss" style="font-size:22px;color:#8d99ad">0</div></div>' +
      '</div>' +
      '<div class="pk-tip">人脉 ' + Math.round(net) + ' · ' + netLabel + '</div>' +
      '<div class="hr-avatar" id="pk-avatar" style="left:50%;top:50%;transform:translate(-50%,-50%)">' +
        '<span class="ring"></span>🧑‍💼</div>' +
      '<div class="pk-hint-lock" id="pk-lock">' +
        '<div>' +
          '<h3>准备好了吗</h3>' +
          '<p>5 秒，点中 HR 头像 ' + P.target + ' 次。<br>手会抖，这很正常。</p>' +
          '<p style="color:#8d99ad;font-size:12px;margin-bottom:18px">人脉 ' + Math.round(net) + ' → ' + netLabel + '</p>' +
          '<button class="btn btn-primary btn-lg" id="pk-start">开 始</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  arenaEl = shell.body.querySelector('#pk-arena');
  avatarEl = shell.body.querySelector('#pk-avatar');
  avatarEl.style.opacity = '0';
  hitsEl = shell.body.querySelector('#pk-hits');
  missEl = shell.body.querySelector('#pk-miss');
  fillEl = shell.body.querySelector('#pk-fill');

  function moveAvatar(){
    if(!running || ended) return;
    var aw = avatarEl.offsetWidth || 84;
    var ah = avatarEl.offsetHeight || 84;
    var W = arenaEl.clientWidth, H = arenaEl.clientHeight;
    var x = G.rand(12, Math.max(13, W - aw - 12));
    var y = G.rand(Math.min(90, H*0.2), Math.max(Math.min(91,H*0.2)+1, H - ah - 16));
    avatarEl.style.left = x + 'px';
    avatarEl.style.top = y + 'px';
    avatarEl.style.transform = 'none';
  }

  function onAvatarClick(e){
    if(!running || ended) return;
    e.stopPropagation();
    hits++;
    hitsEl.textContent = hits;
    avatarEl.classList.add('hit');
    setTimeout(function(){ avatarEl.classList.remove('hit'); }, 90);
    G.sfx.tap();
    if(hits >= P.target){
      arenaEl.classList.add('gold');
      hitsEl.classList.add('gold');
    }
    if(hits >= P.target && hits % P.target === 0){
      G.ui.floatText('+1 over', '#f5c451');
    }
  }

  function onArenaClick(e){
    if(!running || ended) return;
    if(e.target === avatarEl || avatarEl.contains(e.target)) return;
    misses++;
    missEl.textContent = misses;
  }

  function loop(ts){
    if(!running) return;
    var t = (Date.now() - startAt) / P.duration;
    if(t > 1) t = 1;
    fillEl.style.width = (100 - t*100) + '%';
    if(t < 1) rafId = requestAnimationFrame(loop);
  }

  function finish(){
    if(ended) return;
    ended = true; running = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(moveTimer) clearInterval(moveTimer);
    if(endTimer) clearTimeout(endTimer);
    fillEl.style.width = '0%';

    var tier, label, sub, color;
    if(hits >= P.great){ tier = 'great'; label = '大成功'; color = '#f5c451'; sub = '三份简历全部进初筛，其中一份盖了免笔试的章。'; }
    else if(hits >= P.good){ tier = 'good'; label = '成功'; color = '#3fd6a0'; sub = '三份简历都进了初筛。HR 的头像在你眼前晃了一下。'; }
    else if(hits >= P.meh){ tier = 'meh'; label = '勉强'; color = '#ff9a5c'; sub = '只有一家进了初筛。另外两家在你点下去之前就关了窗口。'; }
    else { tier = 'fail'; label = '失败'; color = '#ff5f6d'; sub = '全部已读不回。你甚至不确定自己有没有点中过。'; }

    if(tier === 'great' || tier === 'good') G.sfx.win(); else G.sfx.lose();

    var resEl = document.createElement('div');
    resEl.className = 'mini-result';
    resEl.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,9,14,.9);z-index:20;max-width:none;';
    resEl.innerHTML =
      '<div class="nums"><div><div class="k">命中</div><div class="v">' + hits + '</div></div>' +
      '<div><div class="k">空点</div><div class="v">' + misses + '</div></div></div>' +
      '<div class="big" style="color:' + color + '">' + label + '</div>' +
      '<p>' + sub + '</p>' +
      '<button class="btn btn-primary" id="pk-next" style="margin-top:18px">继 续</button>';
    arenaEl.appendChild(resEl);
    resEl.querySelector('#pk-next').addEventListener('click', function(){
      shell.close();
      if(opts.onDone) opts.onDone({ hits:hits, misses:misses, tier:tier });
    });
  }

  shell.body.querySelector('#pk-start').addEventListener('click', function(){
    var lock = shell.body.querySelector('#pk-lock');
    if(lock) lock.style.display = 'none';
    G.sfx.click();
    running = true; startAt = Date.now();
    avatarEl.style.opacity = '1';
    moveAvatar();
    moveTimer = setInterval(moveAvatar, tickMs);
    rafId = requestAnimationFrame(loop);
    endTimer = setTimeout(finish, P.duration);
    hitsEl.textContent = '0';
  });

  avatarEl.addEventListener('click', onAvatarClick);
  avatarEl.addEventListener('mousedown', function(e){ e.stopPropagation(); });
  arenaEl.addEventListener('click', onArenaClick);
  arenaEl.addEventListener('touchstart', function(e){
    if(e.target === avatarEl || avatarEl.contains(e.target)){
      if(running && !ended){ hits++; hitsEl.textContent = hits; G.sfx.tap();
        if(hits >= P.target){ arenaEl.classList.add('gold'); hitsEl.classList.add('gold'); } }
    } else if(running && !ended){
      misses++; missEl.textContent = misses;
    }
  }, {passive:true});

  return shell;
};

})(window.G);

</script>
<script>
/* ===== js/mini/dice.js ===== */
/* ============================================================
   dice.js —— 跑团面试：d20 + 属性加值 vs DC
   ============================================================ */
window.G = window.G || {};
(function(G){
'use strict';
G.mini = G.mini || {};

/* 属性加值：专业、沟通、心态共同决定，压缩到 +1~+12 */
G.mini.attrBonus = function(){
  var s = G.state;
  if(!s) return 0;
  var raw = (s.stats.major*0.5 + s.stats.comm*0.5 + s.res.mood*0.3) / 16;
  var b = Math.round(raw);
  return Math.max(1, Math.min(12, b));
};

G.mini.rollD20 = function(){
  return Math.floor(Math.random()*20) + 1;
};

/* 单次判定 */
G.mini.diceOne = function(cfg){
  cfg = cfg || {};
  var s = G.state;
  var baseBonus = cfg.bonus !== undefined ? cfg.bonus : G.mini.attrBonus();
  var extra = cfg.extra || 0;
  var dc = cfg.dc || 14;
  var totalBonus = Math.min(16, baseBonus + extra);
  var rolled = null, used = false, rerolled = false;

  var shell = G.mini.shell({
    title: cfg.title || '跑团面试',
    sub: cfg.sub || 'd20 + 属性加值 vs 难度 DC'
  });

  shell.body.innerHTML =
    '<div class="dice-wrap">' +
      '<div class="dice-q">' +
        (cfg.tagline ? '<div class="tagline">' + G.ui.esc(cfg.tagline) + '</div>' : '') +
        '<div class="qtext">' + G.ui.esc(cfg.question || '') + '</div>' +
        '<div class="dc">难度 DC <b>' + dc + '</b> · 你的加值 <b>+' + totalBonus + '</b>' +
          (extra ? '（含准备 +' + extra + '）' : '') + '</div>' +
      '</div>' +
      '<div class="dice-stage">' +
        '<div class="dice-cube" id="dc-cube">?</div>' +
        '<div class="dice-sum" id="dc-sum">掷 d20<br>再加 <b>+' + totalBonus + '</b></div>' +
      '</div>' +
      '<div class="dice-verdict" id="dc-verdict"></div>' +
      '<div style="text-align:center;margin-top:18px" id="dc-actions">' +
        '<button class="btn btn-primary" id="dc-roll">掷 骰</button>' +
      '</div>' +
    '</div>';

  var cube = shell.body.querySelector('#dc-cube');
  var sum = shell.body.querySelector('#dc-sum');
  var verdict = shell.body.querySelector('#dc-verdict');
  var actions = shell.body.querySelector('#dc-actions');
  var rolling = false;

  function finish(r){
    var total = r.roll + totalBonus;
    var success = r.crit ? true : (r.fumble ? false : total >= dc);
    verdict.className = 'dice-verdict ' + (r.crit ? 'crit' : success ? 'win' : 'lose');
    verdict.textContent = r.crit ? '大成功 · 自然 20' : r.fumble ? '大失败 · 自然 1' : (success ? '通过' : '没过');
    sum.innerHTML = 'd20 <b>' + r.roll + '</b> + <b>' + totalBonus + '</b> = <b>' + total + '</b>' +
      '<br>DC ' + dc;
    if(success) G.sfx.win(); else G.sfx.lose();

    var canReroll = !success && !rerolled && s.res.insp > 0;
    var html = '<button class="btn btn-primary" id="dc-next">' + (cfg.nextLabel || '继 续') + '</button>';
    if(canReroll){
      html = '<button class="btn btn-ghost" id="dc-reroll">用 1 灵感点重掷（剩 ' + s.res.insp + '）</button>' + html;
    }
    actions.innerHTML = html;

    var next = actions.querySelector('#dc-next');
    if(next) next.addEventListener('click', function(){
      shell.close();
      if(cfg.onDone) cfg.onDone({ roll:r.roll, total:total, success:success, crit:r.crit, fumble:r.fumble, dc:dc, bonus:totalBonus });
    });
    var rb = actions.querySelector('#dc-reroll');
    if(rb) rb.addEventListener('click', function(){
      rerolled = true;
      s.res.insp -= 1;
      G.ui.refresh();
      roll(true);
    });
  }

  function roll(isReroll){
    if(rolling) return;
    rolling = true;
    cube.classList.remove('crit','fumble');
    cube.classList.add('rolling');
    verdict.textContent = '';
    actions.innerHTML = '';
    var ticks = 0;
    var iv = setInterval(function(){
      cube.textContent = G.mini.rollD20();
      G.sfx.roll();
      ticks++;
      if(ticks > 9){
        clearInterval(iv);
        cube.classList.remove('rolling');
        var v = G.mini.rollD20();
        cube.textContent = v;
        if(v === 20) cube.classList.add('crit');
        if(v === 1) cube.classList.add('fumble');
        rolled = { roll:v, crit:v===20, fumble:v===1 };
        setTimeout(function(){ finish(rolled); rolling = false; }, 260);
      }
    }, 55);
  }

  actions.querySelector('#dc-roll').addEventListener('click', function(){ roll(false); });
  return shell;
};

/* 三题流程 */
G.mini.diceSeries = function(cfg){
  cfg = cfg || {};
  var s = G.state;
  var questions = cfg.questions || [];
  var need = cfg.pass !== undefined ? cfg.pass : 2;
  var extra = cfg.extra || 0;
  var idx = 0, wins = 0, results = [];
  var fumblePenalty = 0;
  var rerollUsed = false;

  var shell = G.mini.shell({
    title: cfg.title || '面试',
    sub: cfg.sub || ('三题过 ' + need + ' 题 · 通过率由你的六维决定')
  });

  function render(){
    var q = questions[idx];
    var bonus = Math.max(1, Math.min(14, G.mini.attrBonus() + extra - fumblePenalty));
    var dots = '';
    for(var i=0;i<questions.length;i++){
      var cls = i < results.length ? (results[i].success ? 'win' : 'lose') : (i === idx ? 'now' : '');
      dots += '<span class="pdot ' + cls + '"></span>';
    }
    shell.body.innerHTML =
      '<div class="dice-wrap">' +
        '<div class="progress-dots">' + dots + '</div>' +
        '<div class="dice-q">' +
          '<div class="tagline">第 ' + (idx+1) + ' 题 / 共 ' + questions.length + ' 题' +
            (q.tag ? ' · ' + G.ui.esc(q.tag) : '') + '</div>' +
          '<div class="qtext">' + G.ui.esc(q.q) + '</div>' +
          '<div class="dc">难度 DC <b>' + q.dc + '</b> · 你的加值 <b>+' + bonus + '</b>' +
            (fumblePenalty ? '（大失败惩罚 −' + fumblePenalty + '）' : '') + '</div>' +
        '</div>' +
        '<div class="dice-stage">' +
          '<div class="dice-cube" id="dc-cube">?</div>' +
          '<div class="dice-sum" id="dc-sum">掷 d20<br>再加 <b>+' + bonus + '</b></div>' +
        '</div>' +
        '<div class="dice-verdict" id="dc-verdict"></div>' +
        '<div style="text-align:center;margin-top:18px" id="dc-actions">' +
          '<button class="btn btn-primary" id="dc-roll">掷 骰</button>' +
        '</div>' +
      '</div>';

    var cube = shell.body.querySelector('#dc-cube');
    var verdict = shell.body.querySelector('#dc-verdict');
    var actions = shell.body.querySelector('#dc-actions');
    var sum = shell.body.querySelector('#dc-sum');
    var busy = false;

    function settle(r){
      var total = r.roll + bonus;
      var success = r.crit ? true : (r.fumble ? false : total >= q.dc);
      if(r.fumble) fumblePenalty = 2;
      results.push({ roll:r.roll, total:total, success:success });
      if(success) wins++;
      verdict.className = 'dice-verdict ' + (r.crit ? 'crit' : success ? 'win' : 'lose');
      verdict.textContent = r.crit ? '大成功 · 自然 20' : r.fumble ? '大失败 · 自然 1' : (success ? '通过' : '没过');
      sum.innerHTML = 'd20 <b>' + r.roll + '</b> + <b>' + bonus + '</b> = <b>' + total + '</b><br>DC ' + q.dc;
      if(success) G.sfx.win(); else G.sfx.lose();

      var html = '';
      if(!success && !rerollUsed && s.res.insp > 0 && idx === results.length - 1){
        html += '<button class="btn btn-ghost" id="dc-rr">用 1 灵感点重掷</button>';
      }
      html += '<button class="btn btn-primary" id="dc-next">' + (idx + 1 >= questions.length ? '看结果' : '下一题') + '</button>';
      actions.innerHTML = html;

      var rr = actions.querySelector('#dc-rr');
      if(rr) rr.addEventListener('click', function(){
        rerollUsed = true;
        s.res.insp -= 1;
        G.ui.refresh();
        results.pop();
        if(success) wins--;
        fumblePenalty = 0;
        actions.innerHTML = '<button class="btn btn-primary" id="dc-roll2">重 掷</button>';
        actions.querySelector('#dc-roll2').addEventListener('click', function(){ doRoll(); });
        verdict.textContent = '';
        sum.innerHTML = '灵感点 -1<br>重掷一次';
      });

      var next = actions.querySelector('#dc-next');
      if(next) next.addEventListener('click', function(){
        if(idx + 1 >= questions.length) summary();
        else { idx++; render(); }
      });
    }

    function doRoll(){
      if(busy) return;
      busy = true;
      verdict.textContent = '';
      actions.innerHTML = '';
      cube.classList.remove('crit','fumble');
      cube.classList.add('rolling');
      var ticks = 0;
      var iv = setInterval(function(){
        cube.textContent = G.mini.rollD20();
        G.sfx.roll();
        ticks++;
        if(ticks > 8){
          clearInterval(iv);
          cube.classList.remove('rolling');
          var v = G.mini.rollD20();
          cube.textContent = v;
          if(v === 20) cube.classList.add('crit');
          if(v === 1) cube.classList.add('fumble');
          setTimeout(function(){ settle({ roll:v, crit:v===20, fumble:v===1 }); busy = false; }, 240);
        }
      }, 55);
    }

    actions.querySelector('#dc-roll').addEventListener('click', doRoll);
  }

  function summary(){
    var passed = wins >= need;
    var color = passed ? '#3fd6a0' : '#ff5f6d';
    var title = passed ? (wins === questions.length ? '全过 · 直接进下一轮' : '通过') : (wins === 1 ? '加面' : '结束');
    shell.body.innerHTML =
      '<div class="mini-result">' +
        '<div class="nums">' +
          '<div><div class="k">通过</div><div class="v" style="color:' + color + '">' + wins + '</div></div>' +
          '<div><div class="k">题数</div><div class="v">' + questions.length + '</div></div>' +
        '</div>' +
        '<div class="big" style="color:' + color + '">' + title + '</div>' +
        '<p>' + (passed ? '面试官合上了本子，说「等通知」。你知道这句话意味着什么。' : '面试官说「我们后面再联系」。你听懂了这句话。') + '</p>' +
        '<button class="btn btn-primary" id="dc-finish" style="margin-top:20px">继 续</button>' +
      '</div>';
    shell.body.querySelector('#dc-finish').addEventListener('click', function(){
      shell.close();
      if(cfg.onDone) cfg.onDone({ wins:wins, passed:passed, results:results });
    });
  }

  render();
  return shell;
};

})(window.G);

</script>
<script>
/* ===== js/mini/puzzle.js ===== */
/* ============================================================
   puzzle.js —— 解密：考公行测 / 考研复试
   ============================================================ */
window.G = window.G || {};
(function(G){
'use strict';
G.mini = G.mini || {};

function shuffleQuestion(q){
  var opts = q.opts.map(function(t,i){ return { t:t, right:i === q.a }; });
  var mixed = G.shuffle(opts);
  var a = -1;
  var out = mixed.map(function(o,i){ if(o.right) a = i; return o.t; });
  return { id:q.id, type:q.type, q:q.q, figure:q.figure, opts:out, a:a, exp:q.exp };
}

G.mini.puzzle = function(cfg){
  cfg = cfg || {};
  var bank = G.quizBank && G.quizBank[cfg.bank || 'gong'] || [];
  if(!bank.length){ if(cfg.onDone) cfg.onDone({ correct:0, total:0 }); return; }
  var count = Math.min(cfg.count || 3, bank.length);
  var picked = G.shuffle(bank).slice(0, count).map(shuffleQuestion);
  var timeLimit = cfg.time || 90;
  var idx = 0, correct = 0, answered = 0, timeLeft = timeLimit, timerId = null, done = false;
  var detail = [];

  var shell = G.mini.shell({
    title: cfg.title || '解密',
    sub: cfg.sub || ('共 ' + count + ' 题 · 限时 ' + timeLimit + ' 秒')
  });

  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

  function startTimer(){
    stopTimer();
    timerId = setInterval(function(){
      if(done) return;
      timeLeft--;
      var el = shell.body.querySelector('#pz-timer');
      if(el){
        el.textContent = timeLeft + ' 秒';
        el.classList.toggle('danger', timeLeft <= 20);
      }
      if(timeLeft <= 0){
        stopTimer();
        finish(true);
      }
    }, 1000);
  }

  function render(){
    var q = picked[idx];
    var letters = ['A','B','C','D'];
    shell.body.innerHTML =
      '<div class="puzzle-wrap">' +
        '<div class="puzzle-top">' +
          '<div class="pz-timer' + (timeLeft <= 20 ? ' danger' : '') + '" id="pz-timer">' + timeLeft + ' 秒</div>' +
          '<div class="pz-prog">第 ' + (idx+1) + ' / ' + count + ' 题</div>' +
        '</div>' +
        '<div class="pz-card">' +
          '<span class="pz-type">' + G.ui.esc(q.type) + '</span>' +
          '<div class="pz-q">' + G.ui.esc(q.q) + '</div>' +
          (q.figure ? '<div class="pz-figure">' + G.ui.esc(q.figure) + '</div>' : '') +
          '<div class="pz-opts" id="pz-opts">' +
            q.opts.map(function(o,i){
              return '<button class="pz-opt" data-i="' + i + '">' +
                '<span class="k">' + letters[i] + '</span><span>' + G.ui.esc(o) + '</span></button>';
            }).join('') +
          '</div>' +
          '<div id="pz-exp"></div>' +
        '</div>' +
      '</div>';

    var btns = shell.body.querySelectorAll('.pz-opt');
    for(var i=0;i<btns.length;i++){
      (function(btn, i2){
        btn.addEventListener('click', function(){
          if(btn.classList.contains('disabled')) return;
          answer(i2, q);
        });
      })(btns[i], i);
    }
  }

  function answer(pick, q){
    var all = shell.body.querySelectorAll('.pz-opt');
    for(var i=0;i<all.length;i++) all[i].classList.add('disabled');
    var ok = pick === q.a;
    if(ok){ correct++; G.sfx.click(); } else { G.sfx.lose(); }
    if(all[q.a]) all[q.a].classList.add('right');
    if(!ok && all[pick]) all[pick].classList.add('wrong');
    answered++;
    detail.push({ id:q.id, ok:ok, type:q.type });

    var exp = shell.body.querySelector('#pz-exp');
    exp.innerHTML = '<div class="pz-exp"><b style="color:' + (ok ? '#8ce9c4' : '#ffaab2') + '">' +
      (ok ? '答对了。' : '答错了。') + '</b> ' + G.ui.esc(q.exp || '') + '</div>' +
      '<div style="text-align:right;margin-top:14px"><button class="btn btn-primary btn-sm" id="pz-next">' +
      (idx + 1 >= count ? '交 卷' : '下 一 题') + '</button></div>';
    exp.querySelector('#pz-next').addEventListener('click', function(){
      if(idx + 1 >= count) finish(false);
      else { idx++; render(); }
    });
  }

  function finish(timeout){
    if(done) return;
    done = true;
    stopTimer();
    var total = count;
    var title, color, sub;
    if(cfg.bank === 'yan'){
      if(correct === total){ title = '全对 · 导师点头'; color = '#3fd6a0'; sub = '导师在名单上写了什么，你没看清。但他笑了。'; }
      else if(correct >= total - 1){ title = '正常'; color = '#f5c451'; sub = '有一题答得含糊，总体还在他的预期里。'; }
      else { title = '被刷风险大增'; color = '#ff5f6d'; sub = '导师把笔放下，说「基础还是要再补一补」。'; }
    } else {
      if(correct === total){ title = '笔试高分'; color = '#3fd6a0'; sub = '三题全对，进面概率 +20%。'; }
      else if(correct >= 2){ title = '正常'; color = '#f5c451'; sub = '够用了。行测这种东西，没有人能全对。'; }
      else { title = '大概率落榜'; color = '#ff5f6d'; sub = '你盯着那道图形推理，直到交卷铃响。'; }
    }
    if(timeout) sub = '时间到了。剩下 ' + (total - answered) + ' 题按错算。' + sub;

    shell.body.innerHTML =
      '<div class="mini-result">' +
        '<div class="nums">' +
          '<div><div class="k">答对</div><div class="v" style="color:' + color + '">' + correct + '</div></div>' +
          '<div><div class="k">题数</div><div class="v">' + total + '</div></div>' +
          '<div><div class="k">用时</div><div class="v">' + (timeLimit - Math.max(0,timeLeft)) + 's</div></div>' +
        '</div>' +
        '<div class="big" style="color:' + color + '">' + title + '</div>' +
        '<p>' + sub + '</p>' +
        '<button class="btn btn-primary" id="pz-finish" style="margin-top:20px">继 续</button>' +
      '</div>';
    shell.body.querySelector('#pz-finish').addEventListener('click', function(){
      shell.close();
      if(cfg.onDone) cfg.onDone({ correct:correct, total:total, timeout:timeout, detail:detail });
    });
  }

  render();
  startTimer();
  return shell;
};

})(window.G);

</script>
<script>

/* ============================================================
   startup.js —— 创业模拟（8 个月）

window.G = window.G || {};
(function(G){
'use strict';
G.mini = G.mini || {};

G.mini.startup = function(cfg){
  cfg = cfg || {};
  var S = G.STARTUP;
  var st = {
    cash:S.init.cash,
    team:S.init.team,
    product:S.init.product,
    users:S.init.users,
    round:0,
    month:1,
    log:[],
    acqOffer:false,
    monthsPlayed:0
  };
  var done = false;

  var shell = G.mini.shell({
    title:'创业模拟',
    sub:'8 个月 · 拿投资、招人、活下来'
  });

  function pushLog(t){ st.log.unshift(t); if(st.log.length > 8) st.log.pop(); }

  var ACTIONS = [
    { id:'build', name:'迭代产品', desc:'产品 +10~16 · 不花钱',
      run:function(){
        var inc = 10 + st.team*2 + G.randInt(0,5);
        st.product = Math.min(100, st.product + inc);
        pushLog('第 ' + st.month + ' 月：产品迭代，完成度 +' + inc + '，现在是 ' + Math.round(st.product) + '。');
      } },
    { id:'ads', name:'投广告拉新', desc:'花 1.5 万 · 用户上涨',
      run:function(){
        if(st.cash < 15000){ pushLog('账上不够 1.5 万，广告位被人抢了。'); return; }
        st.cash -= 15000;
        var gain = Math.round(st.users*0.6 + st.product*200 + 1000 + G.randInt(0,800));
        st.users += gain;
        pushLog('第 ' + st.month + ' 月：投放 1.5 万，新增用户 ' + gain.toLocaleString() + '。');
      } },
    { id:'hire', name:'招人', desc:'团队 +1 · 花 8000',
      run:function(){
        if(st.cash < 8000){ pushLog('给不起签字费，候选人去了隔壁。'); return; }
        st.cash -= 8000;
        st.team += 1;
        pushLog('第 ' + st.month + ' 月：新同事入职，团队 ' + st.team + ' 人。');
      } },
    { id:'raise', name:'找投资', desc:'看产品与用户 · 成功拿到钱',
      run:function(){
        var p = 0.10 + st.product/260 + Math.min(0.30, st.users/40000) + st.round*0.06;
        if(G.chance(p)){
          var amt = st.round === 0 ? 200000 : (st.round === 1 ? 500000 : 1200000);
          st.cash += amt;
          st.round += 1;
          pushLog('第 ' + st.month + ' 月：拿到第 ' + st.round + ' 轮，' + Math.round(amt/10000) + ' 万到账。');
          G.sfx.win();
        } else {
          pushLog('第 ' + st.month + ' 月：见了三家机构，都说「再看看」。');
          st.cash -= 3000;
        }
      } },
    { id:'fire', name:'救火 / 稳住团队', desc:'花 5000 · 团队 +1 或止损',
      run:function(){
        if(st.cash < 5000){ pushLog('连救火的钱都没有，办公室的灯坏了一周。'); return; }
        st.cash -= 5000;
        if(st.team < 3){ st.team += 1; pushLog('第 ' + st.month + ' 月：把人劝回来了，团队恢复。'); }
        else { st.users += Math.round(st.users*0.05); pushLog('第 ' + st.month + ' 月：稳住了核心用户，留存回升。'); }
      } }
  ];

  var EVENTS = [
    { p:0.18, run:function(){ st.users = Math.round(st.users*0.9); pushLog('竞品上线，用户流失 10%。'); } },
    { p:0.14, run:function(){ st.team = Math.max(0, st.team-1); pushLog('合伙人退股，团队少一个人。'); } },
    { p:0.14, run:function(){ st.cash -= 12000; pushLog('一笔坏账，赔了 1.2 万。'); } },
    { p:0.16, run:function(){ st.users = Math.round(st.users*1.25)+200; pushLog('被一个科技博主写了，用户涨了 25%。'); } },
    { p:0.12, run:function(){ st.product = Math.max(0, st.product-6); pushLog('服务器崩了两天，产品评分掉了。'); } }
  ];

  function monthlyCost(){ return S.costPerMonth + st.team*S.teamCost; }

  function render(){
    var runway = st.cash > 0 ? Math.floor(st.cash / monthlyCost()) : 0;
    var resHtml =
      '<div class="su-res">' +
        '<div class="kv"><div class="k">资金</div><div class="v">' + Math.round(st.cash/10000*10)/10 + '<small>万</small></div></div>' +
        '<div class="kv"><div class="k">团队</div><div class="v">' + st.team + '<small>人</small></div></div>' +
        '<div class="kv"><div class="k">产品</div><div class="v">' + Math.round(st.product) + '<small>/100</small></div></div>' +
        '<div class="kv"><div class="k">用户</div><div class="v">' + st.users.toLocaleString() + '</div></div>' +
        '<div class="kv"><div class="k">融资轮次</div><div class="v">' + st.round + '<small>轮</small></div></div>' +
        '<div class="kv"><div class="k">剩余跑道</div><div class="v">' + runway + '<small>月</small></div></div>' +
      '</div>';

    var acts = ACTIONS.map(function(a,i){
      return '<button class="su-act" data-i="' + i + '">' +
        '<span class="n">' + a.name + '</span><span class="d">' + a.desc + '</span></button>';
    }).join('');

    shell.body.innerHTML =
      '<div class="startup-wrap">' +
        '<div class="su-month" style="margin-bottom:12px">第 ' + st.month + ' / ' + S.months + ' 个月 · 每月固定支出 ' + (monthlyCost()/10000).toFixed(1) + ' 万</div>' +
        resHtml +
        '<div class="su-main">' +
          '<div class="su-actions">' + acts + '</div>' +
          '<div class="su-log" id="su-log">' +
            (st.log.length ? st.log.map(function(l){ return '<div>' + G.ui.esc(l) + '</div>'; }).join('') : '<div>什么都没有，除了一间租来的办公室。</div>') +
          '</div>' +
        '</div>' +
      '</div>';

    var btns = shell.body.querySelectorAll('.su-act');
    for(var i=0;i<btns.length;i++){
      (function(btn, i2){
        btn.addEventListener('click', function(){
          if(done) return;
          ACTIONS[i2].run();
          finishMonth();
        });
      })(btns[i], i);
    }
  }

  function finishMonth(){
    /* 自然增长 */
    if(st.product > 0){
      st.users += Math.round(st.users*0.12 + st.product*15 + st.team*20);
    }
    /* 随机事件 */
    for(var i=0;i<EVENTS.length;i++){
      if(G.chance(EVENTS[i].p)){ EVENTS[i].run(); break; }
    }
    /* 收购邀约 */
    if(!st.acqOffer && st.month >= 5 && st.users >= 25000 && G.chance(0.4)){
      st.acqOffer = true;
      pushLog('一家上市公司发来收购意向书。');
    }
    /* 成本 */
    st.cash -= monthlyCost();
    st.monthsPlayed = st.month;

    /* 判定 */
    if(st.cash < 0){ return ending('烧光'); }
    if(st.team <= 0){ return ending('跑路'); }
    if(st.month >= S.months){ return ending(null); }

    st.month++;
    G.ui.refresh();
    render();
  }

  function ending(forced){
    if(done) return;
    done = true;
    var result = forced;
    if(!result){
      if(st.users >= 100000 && st.round >= 2) result = '上市';
      else if(st.users >= 40000 && st.acqOffer) result = '被收购';
      else result = '小而美';
    }
    var color = result === '上市' ? '#f5c451' : result === '被收购' ? '#3fd6a0' : result === '小而美' ? '#9fb0c9' : '#ff5f6d';
    var texts = {
      '上市':'你敲了钟。西装是租的，手是抖的。',
      '被收购':'没上市，但也没输。合同上的数字够你在老家买一套房。',
      '小而美':'八个人，一间办公室，每个月能发出工资。',
      '烧光':'最后一个月，办公室的空调停了。你把电脑搬回了家。',
      '跑路':'合伙人一个个离开。最后一天，办公室里只剩下你和一个纸箱。'
    };
    if(result === '上市') G.sfx.win(); else if(result === '被收购') G.sfx.win(); else G.sfx.lose();

    shell.body.innerHTML =
      '<div class="mini-result">' +
        '<div class="nums">' +
          '<div><div class="k">用户</div><div class="v">' + st.users.toLocaleString() + '</div></div>' +
          '<div><div class="k">资金</div><div class="v">' + Math.round(st.cash/10000*10)/10 + '万</div></div>' +
          '<div><div class="k">融资</div><div class="v">' + st.round + ' 轮</div></div>' +
        '</div>' +
        '<div class="big" style="color:' + color + '">' + result + '</div>' +
        '<p>' + texts[result] + '</p>' +
        '<button class="btn btn-primary" id="su-finish" style="margin-top:20px">继 续</button>' +
      '</div>';
    shell.body.querySelector('#su-finish').addEventListener('click', function(){
      shell.close();
      if(cfg.onDone) cfg.onDone({
        result:result, users:st.users, cash:Math.round(st.cash), round:st.round,
        months:st.monthsPlayed || S.months
      });
    });
  }

  render();
  return shell;
};

})(window.G);

</script>
<script>
/* ===== js/core/autumn.js ===== */
/* ============================================================
   autumn.js —— 大四上 · 秋招决战（20 周）
   ============================================================ */
window.G = window.G || {};
(function(G){
'use strict';
var A = G.autumn = {};
var U = G.ui;
var TIERS = ['SS','S','A','B','C'];

/* ---------------- 状态 ---------------- */
function newState(){
  return {
    role:'', city:'', started:false,
    pool:[],          // 全部公司副本
    applied:[],       // 已投递公司
    runs:0,
    prepStack:0,      // 刷题加成次数
    mock:0, research:0,
    referralUsed:false,
    interviewsThisWeek:0,
    offers:[],
    signed:null,
    startupDone:false,
    weekLog:[]
  };
}

A.begin = function(){
  var s = G.state;
  s.autumn = newState();
  U.chapterCard(6, function(){ A.beginWeek(); });
};

A.resume = function(){
  U.refresh();
  if(G.state.autumn) A.beginWeek();
};

/* ---------------- 周调度 ---------------- */
A.beginWeek = function(){
  var s = G.state;
  if(!s.autumn) s.autumn = newState();
  U.refresh();
  var w = s.week;

  if(w === 1) return A.setup();
  if(w >= 2 && w <= 4) return A.renderStage();
  if(w >= 5 && w <= 7) return A.oaWeek();
  if(w >= 8 && w <= 12) return A.renderStage();
  if(w >= 13 && w <= 15) return A.offerWeek();
  if(w >= 16 && w <= 18) return A.renderStage();
  if(w === 19) return A.renderStage();
  if(w >= 20) return A.finalWeek();
  A.renderStage();
};

/* ---------------- W1 · 定岗 ---------------- */
A.setup = function(){
  var s = G.state;
  var roles = G.ROLES[s.major] || G.ROLES.engineering;
  var tmp = { role:roles[0], city:'北京' };

  function step1(){
    U.modal({
      eyebrow:'决战篇 · 第一周', title:'定岗、定城市',
      body:'<p>秋招正式开闸。第一件事不是投简历，是想清楚：你要去哪儿，做什么。</p>' +
           '<div class="section-label" style="margin:16px 0 8px">岗位</div>' +
           '<div class="pick-row">' + roles.map(function(r){
             return '<button class="pick-chip ' + (tmp.role === r ? 'sel' : '') + '" data-role="' + r + '">' + r + '</button>';
           }).join('') + '</div>' +
           '<div class="section-label" style="margin:18px 0 8px">城市</div>' +
           '<div class="pick-row">' + G.CITIES.map(function(c){
             return '<button class="pick-chip ' + (tmp.city === c ? 'sel' : '') + '" data-city="' + c + '">' + c + '</button>';
           }).join('') + '</div>',
      size:'wide',
      footHTML:'<div class="modal-foot"><button class="btn btn-primary" id="au-go">就它了</button></div>',
      onMount:function(p){
        p.querySelectorAll('[data-role]').forEach(function(b){
          b.addEventListener('click', function(){
            tmp.role = b.getAttribute('data-role');
            p.querySelectorAll('[data-role]').forEach(function(x){ x.classList.toggle('sel', x === b); });
          });
        });
        p.querySelectorAll('[data-city]').forEach(function(b){
          b.addEventListener('click', function(){
            tmp.city = b.getAttribute('data-city');
            p.querySelectorAll('[data-city]').forEach(function(x){ x.classList.toggle('sel', x === b); });
          });
        });
        p.querySelector('#au-go').addEventListener('click', function(){
          s.autumn.role = tmp.role;
          s.autumn.city = tmp.city;
          s.autumn.started = true;
          s.autumn.pool = A.buildPool(tmp.role);
          G.log('秋招定岗：' + tmp.role + ' · ' + tmp.city, 'action');
          U.toast('目标', 'up', tmp.role + ' / ' + tmp.city);
          U.closeModal();
          if(s.flags.startupPath) return step2();
          step3();
        });
      }
    });
  }

  function step2(){
    U.modal({
      eyebrow:'一条岔路', title:'创业还是秋招',
      body:'<p>投资人的微信还躺在置顶里。合伙人昨天又问你：「想好了吗？」</p>' +
           '<p>选创业，秋招的 20 周会被压缩成「创业 17 周 + 应急 3 周」。</p>' +
           '<p style="color:#ffbfa6">毕设答辩 −10，心态每月 −5，失败不可逆。</p>',
      opts:[
        { label:'创业 · 把秋招赌掉', hint:'进入创业模拟 · 17 周', onClick:function(){
            s.autumn.mode = 'startup';
            G.log('你选择了创业。秋招停摆。', 'chapter');
            A.runStartup();
        } },
        { label:'还是老老实实秋招', hint:'正常流程', onClick:function(){
            s.autumn.mode = 'normal';
            s.flags.refuseStartup = true;
            step3();
        } }
      ]
    });
  }

  function step3(){
    var score = G.resumeScore();
    U.modal({
      eyebrow:'决战篇 · 简历定稿', title:'简历分 ' + score,
      body:'<p>你把简历又看了一遍。学历那一行永远在最上面。</p>' +
           '<div class="kv-grid" style="margin-top:14px">' +
             G.resumeBreakdown().map(function(b){
               return '<div class="kv"><div class="k">' + b.k + '</div><div class="v">' + b.v + '</div></div>';
             }).join('') +
           '</div>' +
           '<p style="margin-top:14px;color:#8d99ad;font-size:12px">简历分越高，笔试难度越低。它不会直接给你 offer。</p>',
      size:'wide',
      footHTML:'<div class="modal-foot"><button class="btn btn-primary" id="au-start">开始投递</button></div>',
      onMount:function(p){
        p.querySelector('#au-start').addEventListener('click', function(){
          U.closeModal();
          U.refresh();
          A.renderStage();
        });
      }
    });
  }

  step1();
};

A.runStartup = function(){
  var s = G.state;
  G.mini.startup({
    onDone:function(r){
      s.startup = r;
      s.startupDone = true;
      var moodCost = -5 * (r.months || 8);
      G.applyFx({ mood:moodCost, flag:'didStartup' });
      if(r.result === '上市' || r.result === '被收购'){
        U.alert('创业结算', '<p>结果：<b>' + r.result + '</b>。</p><p>秋招已经结束了。但这一次，你不需要它了。</p>', function(){
          s.week = 20;
          U.refresh();
          A.finalWeek();
        }, '继续');
      } else {
        U.alert('创业结算', '<p>结果：<b>' + r.result + '</b>。</p><p>账户里剩下的钱不够下个月房租。你打开招聘软件，秋招只剩最后三周。</p>', function(){
          s.week = 18;
          U.refresh();
          A.renderStage();
        }, '打开招聘软件');
      }
    }
  });
};

/* ---------------- 公司池 ---------------- */
A.buildPool = function(role){
  var list = G.COMPANIES.filter(function(c){
    return c.roles.indexOf(role) >= 0;
  });
  if(list.length < 10) list = G.COMPANIES.slice();
  var byTier = { SS:[], S:[], A:[], B:[], C:[] };
  list.forEach(function(c){ if(byTier[c.tier]) byTier[c.tier].push(c); });
  var want = { SS:2, S:3, A:4, B:3, C:3 };
  var out = [];
  TIERS.forEach(function(t){
    var arr = G.shuffle(byTier[t] || []).slice(0, want[t]);
    out = out.concat(arr);
  });
  if(out.length < 12){
    G.shuffle(list).forEach(function(c){ if(out.indexOf(c) < 0 && out.length < 14) out.push(c); });
  }
  return out.map(function(c){
    return { id:c.id, name:c.name, tier:c.tier, base:c.base, note:c.note, cities:c.cities,
             status:'pool', miss:0 };
  });
};

/* ---------------- 数值 ---------------- */
A.oaDC = function(c){
  var order = G.TIER_META[c.tier] ? G.TIER_META[c.tier].order : 2;
  var relax = Math.floor((G.resumeScore() - 50) / 12);
  return G.clamp(8 + order*2 - relax, 8, 22);
};
A.intDC = function(c){
  var order = G.TIER_META[c.tier] ? G.TIER_META[c.tier].order : 2;
  return G.clamp(10 + order*1.8, 11, 21);
};
A.need = function(c){ return G.TIER_META[c.tier] ? G.TIER_META[c.tier].resumeNeed : 40; };

/* ---------------- 舞台 ---------------- */
A.phaseName = function(w){
  if(w <= 1) return '定岗';
  if(w <= 4) return '提前批投递';
  if(w <= 7) return '笔试周';
  if(w <= 12) return '面试周';
  if(w <= 15) return '开奖与谈薪';
  if(w <= 18) return '签约';
  if(w === 19) return '答辩准备';
  return '结算';
};

A.renderStage = function(){
  var s = G.state;
  if(!s || !s.autumn){ return G.flow.beginWeek(); }
  var au = s.autumn;
  var stage = U.$('stage');
  if(!stage) return;

  var applied = au.applied.length;
  var oa = au.applied.filter(function(c){ return c.status === 'oa' || c.status === 'oaPass'; }).length;
  var itv = au.applied.filter(function(c){ return c.status === 'interview'; }).length;
  var ofs = au.offers.length;

  var hint = '';
  var w = s.week;
  if(w <= 4) hint = '这周还能投 3 家。投递要过一次跑酷。';
  else if(w <= 7) hint = '笔试周。准备得越充分，OA 越稳。';
  else if(w <= 12) hint = '面试周。每一场都要掷骰。';
  else if(w <= 15) hint = '开奖了。有 offer 就谈，没有就等春招。';
  else if(w <= 18) hint = '签三方之前，你都可以反悔。';
  else if(w === 19) hint = '答辩准备。知识账本会被翻出来。';
  else hint = '大四上结束。';

  var story =
    '<div class="story">' +
      '<div class="story-eyebrow">决战篇 · 大四上 · 第 ' + w + ' 周 · ' + A.phaseName(w) + '</div>' +
      '<h3 class="story-title">' + (au.role ? ('目标：' + au.role + ' · ' + au.city) : '秋招进行中') + '</h3>' +
      '<p class="story-text">' + U.esc(hint) + '</p>' +
      '<div class="kv-grid" style="margin-top:14px">' +
        '<div class="kv"><div class="k">已投</div><div class="v">' + applied + '<small>家</small></div></div>' +
        '<div class="kv"><div class="k">待面试</div><div class="v">' + itv + '<small>家</small></div></div>' +
        '<div class="kv"><div class="k">offer</div><div class="v" style="color:' + (ofs ? '#f5c451' : '#fff') + '">' + ofs + '</div></div>' +
        '<div class="kv"><div class="k">简历分</div><div class="v">' + G.resumeScore() + '</div></div>' +
      '</div>' +
    '</div>';

  var actions = A.actions();
  var html = '<div class="section-label">本周行动</div><div class="action-grid">';
  actions.forEach(function(c){
    var dis = s.ap < (c.ap || 0) || (c.avail && !c.avail());
    var cls = 'action-card' + (dis ? ' disabled' : '') + (c.hot ? ' gold-card' : '');
    html += '<button class="' + cls + '" data-au="' + c.id + '">' +
      '<span class="ac-top"><span class="ac-icon">' + c.icon + '</span>' +
      '<span class="ac-name">' + c.name + '</span>' +
      '<span class="ac-ap' + (c.ap ? '' : ' zero') + '">' + (c.ap || 0) + ' AP</span></span>' +
      '<span class="ac-desc">' + c.desc + '</span></button>';
  });
  html += '</div>';

  stage.innerHTML = story + html;

  var btns = stage.querySelectorAll('[data-au]');
  for(var i=0;i<btns.length;i++){
    (function(b){
      b.addEventListener('click', function(){
        if(b.classList.contains('disabled')) return;
        var id = b.getAttribute('data-au');
        var card = null;
        A.actions().forEach(function(c){ if(c.id === id) card = c; });
        if(card) A.doAction(card);
      });
    })(btns[i]);
  }
  U.refresh();
};

A.actions = function(){
  var s = G.state, au = s.autumn, w = s.week;
  var list = [];

  if(w <= 4 && au.mode !== 'startup'){
    list.push({ id:'apply', name:'投递 3 家', icon:'📮', ap:1,
      desc:'选 3 家公司 · 触发 1 次跑酷投递', hot:true,
      avail:function(){ return au.applied.filter(function(c){ return c.status==='pool'; }).length >= 3 || true; },
      run:A.applyFlow });
  }
  if(w >= 18 && au.mode === 'startup'){
    list.push({ id:'apply', name:'秋招应急投递', icon:'📮', ap:1,
      desc:'只剩 3 周 · 选 3 家', hot:true, run:A.applyFlow });
  }
  if(w >= 5 && w <= 7){
    list.push({ id:'drill', name:'刷笔试真题', icon:'📝', ap:1,
      desc:'专业 +2 · 下周 OA 加成 +3',
      run:function(){
        au.prepStack += 1;
        G.flow.doCard({ id:'drill', ap:0, fx:{ major:2, energy:-8, know:true } });
        U.toast('刷题', 'up', 'OA 加成 +3');
        G.flow.advance();
      } });
  }
  if(w >= 8 && w <= 12){
    list.push({ id:'mock', name:'模拟面试', icon:'🎭', ap:1,
      desc:'沟通 +2 · 面试加值 +3（累积）',
      run:function(){
        au.mock = Math.min(9, au.mock + 3);
        G.flow.doCard({ id:'mock', ap:0, fx:{ comm:2, mood:-2, energy:-6 } });
        U.toast('模拟面试', 'up', '+' + au.mock);
        G.flow.advance();
      } });
    list.push({ id:'interview', name:'去面试', icon:'🗣', ap:1,
      desc:'从待面试名单里选一家 · 跑团判定', hot:true,
      avail:function(){ return au.applied.some(function(c){ return c.status === 'interview'; }); },
      run:A.interviewFlow });
  }
  if(w >= 18 && au.mode === 'startup'){
    list.push({ id:'interview', name:'秋招应急面试', icon:'🗣', ap:1,
      desc:'只剩这几场 · 跑团判定', hot:true,
      avail:function(){ return au.applied.some(function(c){ return c.status === 'interview'; }); },
      run:A.interviewFlow });
  }
  if(w >= 13 && w <= 15){
    list.push({ id:'negotiate', name:'谈薪', icon:'💬', ap:1,
      desc:'沟通判定 · 成功加薪 2 万', hot:true,
      avail:function(){ return au.offers.length > 0; },
      run:A.negotiate });
  }
  if(w >= 16 && w <= 20){
    list.push({ id:'sign', name:'签三方', icon:'✍️', ap:0,
      desc:'从 offer 里选一个 · 也可以再等等', hot:true,
      avail:function(){ return au.offers.length > 0 && !au.signed; },
      run:A.sign });
  }
  if(w === 19){
    list.push({ id:'defense', name:'准备毕设答辩', icon:'📑', ap:1,
      desc:'答辩加值 +3（累积） · 记一条知识',
      run:function(){
        s.flags.defensePrep = (s.flags.defensePrep || 0) + 3;
        G.flow.doCard({ id:'defense', ap:0, fx:{ major:2, energy:-8, know:true } });
        U.toast('答辩准备', 'up', '+' + s.flags.defensePrep);
        G.flow.advance();
      } });
  }
  list.push({ id:'research', name:'研究目标公司', icon:'🔍', ap:1,
    desc:'人脉 +2 · 面试加值 +2（累积）',
    run:function(){
      au.research = Math.min(6, au.research + 2);
      G.flow.doCard({ id:'research', ap:0, fx:{ network:2, energy:-5 } });
      G.flow.advance();
    } });
  list.push({ id:'rest', name:'休息', icon:'🛌', ap:0,
    desc:'精力 +25 · 心态 +8',
    run:function(){ G.flow.doCard(G.ACTIONS.find(function(c){ return c.id === 'rest'; })); } });
  list.push({ id:'slack', name:'摆烂', icon:'🫠', ap:0,
    desc:'精力 +15 · 心态 +10 · 本周不会有事件',
    run:function(){ G.flow.doCard(G.ACTIONS.find(function(c){ return c.id === 'slack'; })); } });
  return list;
};

A.doAction = function(card){
  var s = G.state;
  if(s.ap < (card.ap || 0) || (card.avail && !card.avail())){ U.toast('现在不能这么做', 'down', ''); return; }
  if(card.ap) s.ap -= card.ap;
  U.refresh();
  card.run();
};

/* ---------------- 投递 ---------------- */
A.applyFlow = function(){
  var s = G.state, au = s.autumn;
  var pool = au.pool.filter(function(c){
    return c.status === 'pool' || c.status === 'ghosted';
  });
  if(pool.length < 1){
    U.alert('没公司可投了', '<p>列表已经空了。你知道这意味着什么。</p>', function(){ A.renderStage(); }, '知道了');
    return;
  }
  var chosen = [];
  var need = Math.min(3, pool.length);

  function renderPick(){
    U.modal({
      eyebrow:'投递 · 选 ' + need + ' 家', title:'这一轮投谁',
      body:'<p>一次投递只跑一次跑酷。选错了，这一轮就废了。</p>' +
           '<div class="pick-list" style="margin-top:14px">' +
             pool.map(function(c,i){
               var sel = chosen.indexOf(c.id) >= 0;
               return '<button class="pick-item ' + (sel ? 'sel' : '') + '" data-c="' + c.id + '">' +
                 '<span class="pi-tier ' + c.tier + '">' + c.tier + '</span>' +
                 '<span class="pi-main"><span class="pi-name">' + c.name + '</span>' +
                 '<span class="pi-meta">' + c.base + ' 万/年 · 笔试难度 ' + A.oaDC(c) + ' · 简历需 ' + A.need(c) + '</span></span>' +
                 (sel ? '<span class="pi-sel">已选</span>' : '') +
               '</button>';
             }).join('') +
           '</div>' +
           '<div class="pick-counter">已选 <b id="pick-n">' + chosen.length + '</b> / ' + need + '</div>',
      size:'wide',
      footHTML:'<div class="modal-foot"><button class="btn btn-primary" id="pick-go">投 出 去</button></div>',
      onMount:function(p){
        p.querySelectorAll('[data-c]').forEach(function(b){
          b.addEventListener('click', function(){
            var id = b.getAttribute('data-c');
            var i = chosen.indexOf(id);
            if(i >= 0) chosen.splice(i,1);
            else {
              if(chosen.length >= need){ U.toast('只能选 ' + need + ' 家', 'down', ''); return; }
              chosen.push(id);
            }
            U.closeModal();
            renderPick();
          });
        });
        p.querySelector('#pick-go').addEventListener('click', function(){
          if(chosen.length < need){ U.toast('还差 ' + (need - chosen.length) + ' 家', 'down', ''); return; }
          U.closeModal();
          runParkour(chosen.map(function(id){
            return pool.filter(function(c){ return c.id === id; })[0];
          }));
        });
      }
    });
  }

  function runParkour(companies){
    G.mini.parkour({
      onDone:function(res){
        au.runs++;
        var n = res.tier === 'great' ? 3 : res.tier === 'good' ? 3 : res.tier === 'meh' ? 1 : 0;
        var freeOA = res.tier === 'great';
        var lines = [];
        companies.forEach(function(c, i){
          var okByCount = i < n;
          var resume = G.resumeScore();
          var hardGate = A.need(c) <= 38 || (resume + 8 >= A.need(c));
          if(okByCount && (hardGate || i === 0 && res.tier === 'great')){
            c.status = (au.mode === 'startup') ? 'interview' : 'oa';
            c.oaBonus = freeOA ? 3 : 0;
            c.miss = 0;
            au.applied.push(c);
            lines.push('<div style="color:#8ce9c4">✓ ' + c.name + ' 进入初筛' + (freeOA ? '（免笔试）' : '') + '</div>');
          } else {
            c.miss = (c.miss || 0) + 1;
            c.status = 'ghosted';
            lines.push('<div style="color:#ffaab2">× ' + c.name + ' 已读不回</div>' +
              (!okByCount ? '<div style="font-size:11px;color:#7d8a9e">　跑酷没跟上节奏</div>' :
               '<div style="font-size:11px;color:#7d8a9e">　简历分差 ' + Math.max(0, A.need(c) - resume) + ' 分</div>'));
          }
        });
        if(res.tier === 'fail'){
          G.gainRes('mood', -3);
        }
        U.modal({
          eyebrow:'投递结果', title:res.tier === 'great' ? '全进去了' : res.tier === 'good' ? '三份都投进去了' : res.tier === 'meh' ? '只进去一家' : '全都没回',
          body:'<p>5 秒内点了 ' + res.hits + ' 次。' + (res.hits >= 22 ? '手速已经超出常人。' : '') + '</p>' +
               '<div style="margin-top:10px;line-height:2">' + lines.join('') + '</div>',
          size:'narrow',
          footHTML:'<div class="modal-foot"><button class="btn btn-primary" id="pk-ok">继 续</button></div>',
          onMount:function(p){
            p.querySelector('#pk-ok').addEventListener('click', function(){
              U.closeModal();
              U.refresh();
              G.flow.advance();
            });
          }
        });
      }
    });
  }

  renderPick();
};

/* ---------------- W5-7 笔试 ---------------- */
A.oaWeek = function(){
  var s = G.state, au = s.autumn;
  var pending = au.applied.filter(function(c){ return c.status === 'oa'; });
  if(!pending.length){
    U.refresh();
    return A.renderStage();
  }

  var strategies = [
    { id:'drill', name:'刷题突击', desc:'+3 判定 · 消耗 1 次刷题加成', need:function(){ return au.prepStack > 0; },
      bonus:3, after:function(){ au.prepStack -= 1; } },
    { id:'refer', name:'找人内推', desc:'+4 判定 · 人脉需 50，只能用一次', need:function(){ return s.stats.network >= 50 && !au.referralUsed; },
      bonus:4, after:function(){ au.referralUsed = true; } },
    { id:'naked', name:'裸考', desc:'+0 · 什么都不准备', need:function(){ return true; },
      bonus:0, after:function(){} }
  ];

  U.modal({
    eyebrow:'笔试周 · 第 ' + s.week + ' 周', title:'OA 来了',
    body:'<p>' + pending.length + ' 家公司的笔试链接躺在邮箱里，都写着「48 小时内完成」。</p>' +
         '<p>选一种打法，一次应用到本周所有笔试。</p>',
    opts:strategies.map(function(st){
      var ok = st.need();
      return { label:st.name, hint:ok ? st.desc : (st.id === 'drill' ? '还没有刷题加成' : '人脉不足或已用掉'),
               disabled:!ok,
               onClick:function(){ runOA(pending, st); } };
    })
  });

  function runOA(list, st){
    st.after();
    var lines = [], passed = 0;
    list.forEach(function(c){
      var dc = A.oaDC(c) + (c.tier === 'SS' ? 1 : 0);
      var bonus = G.mini.attrBonus() + st.bonus + (c.oaBonus || 0);
      var roll = G.mini.rollD20();
      var total = roll + bonus;
      var ok = (roll === 20) || (roll !== 1 && total >= dc);
      if(ok){
        c.status = 'interview';
        passed++;
        lines.push('<div style="color:#8ce9c4">✓ ' + c.name + ' 通过（' + total + ' / ' + dc + '）</div>');
      } else {
        c.status = 'rejected';
        lines.push('<div style="color:#ffaab2">× ' + c.name + ' 没过（' + total + ' / ' + dc + '）</div>');
      }
    });
    if(passed === 0) G.gainRes('mood', -5);
    G.log('笔试：' + passed + ' / ' + list.length + ' 通过。', passed ? 'good' : 'bad');
    G.ui.refresh();
    U.modal({
      eyebrow:'笔试结果', title:passed ? ('过了 ' + passed + ' 家') : '全军覆没',
      body:'<p>用的策略：' + st.name + '</p><div style="margin-top:10px;line-height:2">' + lines.join('') + '</div>',
      size:'narrow',
      footHTML:'<div class="modal-foot"><button class="btn btn-primary" id="oa-ok">继 续</button></div>',
      onMount:function(p){
        p.querySelector('#oa-ok').addEventListener('click', function(){
          U.closeModal(); U.refresh(); A.renderStage();
        });
      }
    });
  }
};

/* ---------------- W8-12 面试 ---------------- */
A.interviewFlow = function(){
  var s = G.state, au = s.autumn;
  var list = au.applied.filter(function(c){ return c.status === 'interview'; });
  if(!list.length){ U.toast('没有待面试的公司', 'down', ''); return; }

  U.modal({
    eyebrow:'面试周', title:'去面哪一家',
    body:'<p>一周只够认真准备一场。选一家。</p>',
    size:'wide',
    opts:list.map(function(c){
      return { label:c.name + '（' + c.tier + '）',
               hint:c.base + ' 万 · 难度 DC ' + Math.round(A.intDC(c)) + ' · ' + (c.note || ''),
               onClick:function(){ startInterview(c); } };
    })
  });

  function startInterview(c){
    var extra = Math.round(au.mock + au.research + (s.flags.referral ? 2 : 0));
    var dc = A.intDC(c);
    G.mini.diceSeries({
      title:c.name + ' · 面试',
      sub:'三题过两题 · ' + c.tier + ' 档',
      extra:extra,
      questions:[
        { q:'自我介绍。请在一分钟内让我记住你。', dc:Math.round(dc) },
        { q:'讲一个你做过的最难的项目，难在哪，你怎么解决的？', dc:Math.round(dc) + 1, tag:'技术面' },
        { q:'如果我们不录用你，你觉得会是什么原因？', dc:Math.round(dc) + 2, tag:'压力面' }
      ],
      onDone:function(r){
        if(r.passed){
          c.status = 'offer';
          c.offerSalary = c.base + G.randInt(-3,3);
          c.offerSalary = Math.max(7, c.offerSalary);
          au.offers.push({
            id:c.id, name:c.name, tier:c.tier, salary:c.offerSalary, source:'秋招'
          });
          G.log('拿到 ' + c.name + ' 的 offer。', 'good');
          G.sfx.win();
          U.alert('通过', '<p>面试官说「我们这边会尽快给你消息」。</p><p>两天后，HR 发来了意向书：' + c.offerSalary + ' 万/年。</p>',
            function(){ U.refresh(); G.flow.advance(); }, '继续');
        } else {
          c.status = 'rejected';
          G.gainRes('mood', -6);
          G.log(c.name + ' 面试没过。', 'bad');
          U.alert('没通过', '<p>你没有等到消息。一周后，官网上的岗位状态变成了「已招满」。</p>',
            function(){ U.refresh(); G.flow.advance(); }, '知道了');
        }
      }
    });
  }
};

/* ---------------- W13-15 开奖 ---------------- */
A.offerWeek = function(){
  var s = G.state, au = s.autumn;
  U.refresh();
  if(s.week === 13 && au.offers.length){
    var lines = au.offers.map(function(o){
      return '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)">' +
        '<span>' + o.name + ' <span class="pi-tier ' + o.tier + '" style="margin-left:6px">' + o.tier + '</span></span>' +
        '<b style="font-family:monospace;color:#f5c451">' + o.salary + ' 万</b></div>';
    }).join('');
    U.modal({
      eyebrow:'第 13 周 · 开奖', title:'你有 ' + au.offers.length + ' 个 offer',
      body:'<p>手机震了三次。你按顺序点开，心跳一次比一次快。</p><div style="margin-top:12px">' + lines + '</div>' +
           '<p style="margin-top:14px;color:#8d99ad;font-size:12px">接下来三周可以谈薪。谈好了再签。</p>',
      size:'narrow',
      footHTML:'<div class="modal-foot"><button class="btn btn-primary" id="of-ok">继 续</button></div>',
      onMount:function(p){
        p.querySelector('#of-ok').addEventListener('click', function(){
          U.closeModal(); A.renderStage();
        });
      }
    });
    return;
  }
  if(s.week === 15 && !au.offers.length){
    U.modal({
      eyebrow:'第 15 周', title:'还没有 offer',
      body:'<p>提前批结束了。群里开始出现「上岸」两个字。</p>' +
           '<p>你知道还有正式批、还有春招。但你也知道，越往后越难。</p>',
      size:'narrow',
      footHTML:'<div class="modal-foot"><button class="btn btn-primary" id="no-ok">继 续</button></div>',
      onMount:function(p){
        p.querySelector('#no-ok').addEventListener('click', function(){
          U.closeModal(); A.renderStage();
        });
      }
    });
    return;
  }
  A.renderStage();
};

A.negotiate = function(){
  var s = G.state, au = s.autumn;
  if(!au.offers.length){ U.toast('没有可谈的 offer', 'down', ''); return; }
  var target = au.offers[au.offers.length-1];
  G.mini.diceOne({
    title:'谈薪', question:'「这个数还有空间吗？」——你把这句话说出口了。',
    dc:15, extra:Math.round(s.stats.comm/20), nextLabel:'看结果',
    onDone:function(r){
      if(r.success){
        target.salary += 2;
        G.gainRes('mood', 6);
        U.alert('谈成了', '<p>HR 说「我帮你申请一下」。第二天，总包多了 2 万。</p><p>现在 ' + target.name + ' 给到 ' + target.salary + ' 万。</p>',
          function(){ U.refresh(); G.flow.advance(); }, '继续');
      } else {
        G.gainRes('mood', -3);
        U.alert('没谈成', '<p>HR 很客气地说「我们这是统一标准」。</p><p>你说了句「理解」，然后挂了电话。</p>',
          function(){ U.refresh(); G.flow.advance(); }, '知道了');
      }
    }
  });
};

/* ---------------- W16-18 签约 ---------------- */
A.sign = function(){
  var s = G.state, au = s.autumn;
  if(!au.offers.length){ U.toast('没有 offer 可签', 'down', ''); return; }
  var sorted = au.offers.slice().sort(function(a,b){ return b.salary - a.salary; });
  U.modal({
    eyebrow:'签约', title:'选一个',
    body:'<p>三方协议只有一份。签了，就是它了。</p>',
    size:'wide',
    opts:sorted.map(function(o){
      return { label:o.name + ' · ' + o.salary + ' 万', hint:o.tier + ' 档 · ' + o.source,
               onClick:function(){
                 au.signed = o;
                 s.signed = o;
                 s.offers = s.offers.concat([o]);
                 G.log('签约：' + o.name + '，' + o.salary + ' 万。', 'good');
                 G.gainRes('mood', 12);
                 U.alert('签了', '<p>你在三方协议上签了名字，日期写得有点歪。</p><p>' + o.name + ' · ' + o.salary + ' 万/年。</p><p>你拍了张照，发给了家里。</p>',
                   function(){ U.refresh(); G.flow.advance(); }, '继续');
               } };
    }).concat([{ label:'再等等，也许还有更好的', hint:'心态 −2',
                 onClick:function(){ G.gainRes('mood', -2); G.flow.advance(); } }])
  });
};

/* ---------------- W20 · 结算 ---------------- */
A.finalWeek = function(){
  var s = G.state, au = s.autumn;
  var lines = '';
  if(au){
    lines = '<div class="kv-grid">' +
      '<div class="kv"><div class="k">投递</div><div class="v">' + au.applied.length + '<small>家</small></div></div>' +
      '<div class="kv"><div class="k">面试</div><div class="v">' + au.applied.filter(function(c){ return c.status === 'offer' || c.status === 'rejected'; }).length + '<small>场</small></div></div>' +
      '<div class="kv"><div class="k">offer</div><div class="v">' + (au.signed ? 1 : 0) + '</div></div>' +
      '<div class="kv"><div class="k">签约</div><div class="v" style="font-size:13px">' + (au.signed ? au.signed.name : '无') + '</div></div>' +
    '</div>';
  }
  G.save();
  U.modal({
    eyebrow:'大四上 · 结束', title:au && au.signed ? '你上岸了' : '秋天过去了',
    body:lines + '<p style="margin-top:14px">' +
      (au && au.signed ? '接下来的事，是大四下。' : '还有春招。还有第二人生。') + '</p>',
    size:'narrow',
    footHTML:'<div class="modal-foot"><button class="btn btn-primary" id="au-end">结 束 秋 招</button></div>',
    onMount:function(p){
      p.querySelector('#au-end').addEventListener('click', function(){
        U.closeModal();
        s.week = 20;
        G.flow.endChapter();
      });
    }
  });
};

})(window.G);

</script>
<script>
/* ===== js/core/secondlife.js ===== */
/* ============================================================
   secondlife.js —— 毕业后一年 · 第二人生（20 周）
   ============================================================ */
window.G = window.G || {};
(function(G){
'use strict';
var L = G.secondlife = {};
var U = G.ui;

var ROUTE_NAME = { job:'秋招二战', spring:'春招', kaoyan:'考研二战', kaogong:'考公' };

function newState(){
  return {
    main:null, sub:null,
    prog:{ kaoyan:0, kaogong:0 },
    flags:{ written:null, interview:null, exam:null, retest:null },
    offers:[],
    attempts:0,
    final:null
  };
}

L.begin = function(){
  var s = G.state;
  s.secondlife = newState();
  U.chapterCard(8, function(){ L.beginWeek(); });
};

L.resume = function(){
  U.refresh();
  if(G.state.secondlife) L.beginWeek();
};

/* ---------------- 周调度 ---------------- */
L.beginWeek = function(){
  var s = G.state;
  if(!s.secondlife) s.secondlife = newState();
  U.refresh();
  var w = s.week;

  if(w === 1) return L.chooseRoute();
  if(w >= 20) return L.finalWeek();

  /* 固定节点 */
  var sl = s.secondlife;
  if(w === 6 && L.hasRoute('kaogong') && !sl.flags.written) return L.civilWritten();
  if(w === 8 && L.hasRoute('kaoyan') && !sl.flags.exam) return L.gradExam();
  if(w === 11 && L.hasRoute('kaogong') && sl.flags.written && !sl.flags.interview) return L.civilInterview();
  if(w === 12 && L.hasRoute('kaoyan') && sl.flags.exam && !sl.flags.retest) return L.gradRetest();

  L.renderStage();
};

L.hasRoute = function(r){
  var sl = G.state.secondlife;
  return sl && (sl.main === r || sl.sub === r);
};
L.isMain = function(r){
  var sl = G.state.secondlife;
  return sl && sl.main === r;
};

/* ---------------- W1 · 选线 ---------------- */
L.chooseRoute = function(){
  var s = G.state;
  var tmp = { main:null, sub:null };
  var hasOffer = (s.signed || s.offers.length) ? true : false;

  function render(){
    var routes = [
      { id:'job', name:'秋招二战', desc:'补招、捡漏 · 岗位质量降一档' },
      { id:'spring', name:'春招', desc:'岗位少、节奏快 · 九月到十二月' },
      { id:'kaoyan', name:'考研二战', desc:'初试 + 复试解密 · 复习进度 ' + Math.round(s.routes.kaoyan) + '%' },
      { id:'kaogong', name:'考公', desc:'行测解密 + 面试 · 复习进度 ' + Math.round(s.routes.kaogong) + '%' }
    ];
    if(hasOffer){
      routes.unshift({ id:'work', name:'直接入职', desc:'带着现有的 offer 结束这一年' });
    }
    U.modal({
      eyebrow:'第二人生 · 第一周', title:'这一年，怎么过',
      body:'<p>毕业证拿到了。同学陆续入职，你的时间忽然变得很完整，也很空。</p>' +
           '<p>选 <b>1 条主线 + 1 条辅线</b>。辅线效率只有 60%。</p>' +
           (hasOffer ? '<p style="color:#ffbfa6">你手上还有一个 offer。选别的路，就意味着毁约——违约金 5000，口碑也会受影响。</p>' : '') +
           '<div class="section-label" style="margin:16px 0 8px">主线</div>' +
           '<div class="pick-row">' + routes.map(function(r){
             return '<button class="pick-chip ' + (tmp.main === r.id ? 'sel' : '') + '" data-m="' + r.id + '">' + r.name + '</button>';
           }).join('') + '</div>' +
           '<div class="section-label" style="margin:18px 0 8px">辅线（可不选）</div>' +
           '<div class="pick-row"><button class="pick-chip ' + (tmp.sub === null ? 'sel' : '') + '" data-s="none">不选</button>' +
           routes.filter(function(r){ return r.id !== 'work'; }).map(function(r){
             return '<button class="pick-chip ' + (tmp.sub === r.id ? 'sel' : '') + '" data-s="' + r.id + '">' + r.name + '</button>';
           }).join('') + '</div>' +
           '<p style="margin-top:14px;color:#8d99ad;font-size:12px" id="sl-note">选择一条路，然后接受它的代价。</p>',
      size:'wide',
      footHTML:'<div class="modal-foot"><button class="btn btn-primary" id="sl-go" disabled>就 这 样</button></div>',
      onMount:function(p){
        var go = p.querySelector('#sl-go');
        function sync(){
          go.disabled = !tmp.main;
          p.querySelectorAll('[data-m]').forEach(function(b){ b.classList.toggle('sel', b.getAttribute('data-m') === tmp.main); });
          p.querySelectorAll('[data-s]').forEach(function(b){ b.classList.toggle('sel', b.getAttribute('data-s') === (tmp.sub || 'none')); });
        }
        p.querySelectorAll('[data-m]').forEach(function(b){
          b.addEventListener('click', function(){
            tmp.main = b.getAttribute('data-m');
            if(tmp.sub === tmp.main) tmp.sub = null;
            sync();
          });
        });
        p.querySelectorAll('[data-s]').forEach(function(b){
          b.addEventListener('click', function(){
            var v = b.getAttribute('data-s');
            tmp.sub = (v === 'none') ? null : v;
            if(tmp.sub === tmp.main) tmp.sub = null;
            sync();
          });
        });
        go.addEventListener('click', function(){
          if(!tmp.main) return;
          if(tmp.main === 'work'){
            U.closeModal();
            G.log('你带着 offer 入职了。', 'chapter');
            return G.ending.compute();
          }
          if(hasOffer && !s.flags.brokeContract){
            s.signed = null;
            s.flags.brokeContract = true;
            G.gainMoney(-5000);
            G.gainRes('mood', -5);
            U.toast('违约金', 'down', '−¥5,000');
          }
          s.secondlife.main = tmp.main;
          s.secondlife.sub = tmp.sub;
          G.log('第二人生：主线 ' + ROUTE_NAME[tmp.main] + (tmp.sub ? ' / 辅线 ' + ROUTE_NAME[tmp.sub] : ''), 'chapter');
          U.closeModal();
          U.toast('路线', 'up', ROUTE_NAME[tmp.main]);
          U.refresh();
          L.renderStage();
        });
        sync();
      }
    });
  }
  render();
};

/* ---------------- 舞台 ---------------- */
L.renderStage = function(){
  var s = G.state;
  var sl = s.secondlife;
  if(!sl) return G.flow.beginWeek();
  var stage = U.$('stage');
  if(!stage) return;

  var scene = [
    '出租屋的窗户朝北，一年四季没有太阳。',
    '自习室的空调开得很足，你带了一件外套。',
    '楼下的便利店换了第三批店员，你还没有工作。',
    '手机里还留着去年秋招的群，没人再说话了。',
    '日历上划掉的格子越来越多。'
  ][(s.week - 1) % 5];

  var prog = '';
  if(L.hasRoute('kaoyan')) prog += '<div class="kv"><div class="k">考研复习</div><div class="v">' + Math.round(s.routes.kaoyan) + '<small>%</small></div></div>';
  if(L.hasRoute('kaogong')) prog += '<div class="kv"><div class="k">考公复习</div><div class="v">' + Math.round(s.routes.kaogong) + '<small>%</small></div></div>';
  prog += '<div class="kv"><div class="k">offer</div><div class="v">' + sl.offers.length + '</div></div>';
  prog += '<div class="kv"><div class="k">第几周</div><div class="v">' + s.week + '<small>/20</small></div></div>';

  var html =
    '<div class="story">' +
      '<div class="story-eyebrow">第二人生 · 毕业后一年 · 第 ' + s.week + ' 周</div>' +
      '<h3 class="story-title">' + ROUTE_NAME[sl.main] + (sl.sub ? ' · 辅线 ' + ROUTE_NAME[sl.sub] : '') + '</h3>' +
      '<p class="story-text">' + U.esc(scene) + '</p>' +
      '<div class="kv-grid" style="margin-top:14px">' + prog + '</div>' +
    '</div>' +
    '<div class="section-label">本周行动</div><div class="action-grid" id="sl-actions"></div>';

  stage.innerHTML = html;
  var box = stage.querySelector('#sl-actions');
  var acts = L.actions();
  acts.forEach(function(c){
    var dis = s.ap < c.ap || (c.avail && !c.avail());
    var b = document.createElement('button');
    b.className = 'action-card' + (dis ? ' disabled' : '') + (c.hot ? ' gold-card' : '');
    b.innerHTML = '<span class="ac-top"><span class="ac-icon">' + c.icon + '</span>' +
      '<span class="ac-name">' + c.name + '</span>' +
      '<span class="ac-ap' + (c.ap ? '' : ' zero') + '">' + c.ap + ' AP</span></span>' +
      '<span class="ac-desc">' + c.desc + '</span>';
    b.addEventListener('click', function(){
      if(dis) return;
      L.doAction(c);
    });
    box.appendChild(b);
  });
  U.refresh();
};

L.actions = function(){
  var s = G.state, sl = s.secondlife;
  var list = [];

  if(L.hasRoute('kaoyan') || L.hasRoute('kaogong')){
    list.push({ id:'study', name:'复习', icon:'📖', ap:1,
      desc:'主线 +8% · 辅线 +5% · 记一条知识',
      run:function(){
        var g = { energy:-12, mood:-2, know:true };
        G.flow.doCard({ id:'study', ap:0, fx:g });
        if(L.hasRoute('kaoyan')) s.routes.kaoyan = Math.min(100, s.routes.kaoyan + (L.isMain('kaoyan') ? 8 : 5));
        if(L.hasRoute('kaogong')) s.routes.kaogong = Math.min(100, s.routes.kaogong + (L.isMain('kaogong') ? 8 : 5));
        U.toast('复习', 'up', '进度 +' + (8));
        G.flow.advance();
      } });
  }

  if(L.hasRoute('job') || L.hasRoute('spring')){
    list.push({ id:'apply', name:(L.hasRoute('spring') ? '投春招' : '投补招'), icon:'📮', ap:1,
      desc:'跑酷投递 + 面试 · 拿 offer',
      hot:true,
      run:function(){ L.applyFlow(); } });
  }

  list.push({ id:'parttime', name:'打工', icon:'💰', ap:1,
    desc:'生活费 +600 · 精力 −12',
    run:function(){
      G.flow.doCard({ id:'parttime', ap:0, fx:{ money:600, energy:-12, mood:-2 } });
      G.flow.advance();
    } });
  list.push({ id:'family', name:'陪家人', icon:'🏠', ap:1,
    desc:'心态 +8 · 家庭线',
    run:function(){
      G.flow.doCard({ id:'family', ap:0, fx:{ mood:8 } });
      if(s.flags.familySupport) s.res.mood = G.clamp(s.res.mood + 3, 0, 100);
      G.flow.advance();
    } });
  list.push({ id:'rest', name:'休息', icon:'🛌', ap:0,
    desc:'精力 +25 · 心态 +6',
    run:function(){ G.flow.doCard({ id:'rest', ap:0, fx:{ energy:25, mood:6 } }); } });
  return list;
};

L.doAction = function(card){
  var s = G.state;
  if(s.ap < card.ap) return;
  s.ap -= card.ap;
  U.refresh();
  card.run();
};

/* ---------------- 求职线 ---------------- */
L.applyFlow = function(){
  var s = G.state, sl = s.secondlife;
  var spring = L.hasRoute('spring') && !L.hasRoute('job');
  var tier = spring ? 'C' : (s.secondlife.attempts === 0 ? 'B' : 'C');
  var companyName = spring
    ? ['春招补录 · 某中型公司','春招补录 · 本地企业','春招补录 · 银行科技'][sl.attempts % 3]
    : ['补招 · 中型互联网','补招 · 传统软件公司','补招 · 创业公司'][sl.attempts % 3];
  sl.attempts++;

  G.mini.parkour({
    onDone:function(res){
      var n = res.tier === 'great' ? 2 : res.tier === 'good' ? 1 : res.tier === 'meh' ? 1 : 0;
      if(n === 0){
        G.gainRes('mood', -8);
        U.alert('没有回音', '<p>简历投出去，显示「已查看」。</p><p>然后就没有然后了。</p>', function(){ U.refresh(); G.flow.advance(); }, '继续');
        return;
      }
      var bonus = (s.offers && s.offers.length === 0 && !s.signed) ? 1 : 0;
      G.mini.diceSeries({
        title:companyName, sub:'三题过两题' + (bonus ? ' · 0 offer 加成 +1' : ''),
        extra:bonus,
        questions:[
          { q:'毕业这一年你在做什么？', dc:13 },
          { q:'为什么选择我们公司？', dc:14 },
          { q:'你对薪资有什么期待？', dc:13, tag:'HR 面' }
        ],
        onDone:function(r){
          if(r.passed){
            var sal = spring ? G.randInt(7,11) : G.randInt(9,14);
            sl.offers.push({ name:companyName, tier:G.OFFER_RANK(sal), salary:sal, source:spring ? '春招' : '二战' });
            s.offers.push(sl.offers[sl.offers.length-1]);
            G.gainRes('mood', 12);
            G.log('第二人生拿到 offer：' + companyName, 'good');
            U.alert('过了', '<p>HR 说下周发 offer。</p><p>' + sal + ' 万/年。比你去年想要的那个数低，但你现在只想上岸。</p>',
              function(){ U.refresh(); G.flow.advance(); }, '继续');
          } else {
            G.gainRes('mood', -8);
            U.alert('没过', '<p>「我们后面再联系。」</p><p>你走出写字楼，在路边站了一会儿。</p>',
              function(){ U.refresh(); G.flow.advance(); }, '知道了');
          }
        }
      });
    }
  });
};

L.civilInterview = function(){

  G.mini.diceSeries({
    title:'考公 · 面试', sub:'结构化面试 · 三题过两题',
    extra:Math.round(s.stats.comm/25),

          function(){ G.flow.advance(); }, '知道了');

    }
  });
};

/* ---------------- 考研 ---------------- */
L.gradExam = function(){

  var pass = G.chance(p);

         '<p style="color:#8d99ad;font-size:12px">复习进度 ' + Math.round(s.routes.kaoyan) + '% · 专业 ' + Math.round(s.stats.major) + '</p>',

          function(){ U.refresh(); G.flow.advance(); }, '继续');

        s.kaoyanResult = '落榜';
        G.gainRes('mood', -18);
        G.log('考研初试没过。', 'bad');
        U.alert('差了一点', '<p>总分比国家线低了 6 分。</p><p>你关掉页面，把专业课书摞在一起，没有扔。</p>',
          function(){ U.refresh(); G.flow.advance(); }, '知道了');
      }
    } }]
  });
};

L.gradRetest = function(){
  var s = G.state;
  U.modal({
    eyebrow:'考研 · 复试', title:'导师的问题',
    body:'<p>复试考场里有五个老师。主考官翻着你的材料，说：「我问两个专业问题。」</p>',
    size:'narrow',
    opts:[{ label:'开始作答', onClick:function(){
      G.mini.puzzle({
        bank:'yan', count:2, time:120,

        onDone:function(r){

          if(r.correct >= 2){
            s2.kaoyanResult = '上岸';
            G.addTag('研究生上岸','soft');
            G.gainRes('mood', 20);

            U.alert('拟录取', '<p>名单出来那天，你在自习室坐了半小时，什么都没做。</p><p>然后你给家里打了电话。</p>',
              function(){ U.refresh(); G.flow.advance(); }, '继续');
          } else if(r.correct === 1){
            s2.kaoyanResult = '上岸';

            G.log('考研复试通过。', 'good');

              function(){ U.refresh(); G.flow.advance(); }, '继续');
          } else {
            s2.kaoyanResult = '落榜';

            G.log('考研复试被刷。', 'bad');

/* ---------------- W20 · 终章 ---------------- */
L.finalWeek = function(){
  var s = G.state;
  var sl = s.secondlife;
  var lines = [];
  if(sl.offers.length) lines.push('<div style="color:#8ce9c4">拿到了 ' + sl.offers.length + ' 个 offer（最高 ' + Math.max.apply(null, sl.offers.map(function(o){ return o.salary; })) + ' 万）</div>');
  if(s.kaoyanResult) lines.push('<div>考研：' + s.kaoyanResult + '</div>');
  if(s.kaogongResult) lines.push('<div>考公：' + s.kaogongResult + '</div>');
  if(s.startup) lines.push('<div>创业：' + s.startup.result + '</div>');

  G.save();
  U.modal({

         '<div style="margin-top:12px;line-height:2">' + lines.join('') + '</div>',
